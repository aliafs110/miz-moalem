<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="میز معلم">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffd9c7">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<title>میز کار معلم زبان کودک</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800&family=Nunito:wght@600;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
:root{
  --bg:#fffaf3; --card:#ffffff; --ink:#2b2a33; --muted:#6b6878; --line:#efe7da;
  --brand:#e86a4f; --brand2:#3d8bfd; --soft:#fff1e8;
  --r:18px;
}
*{box-sizing:border-box}

body{margin:0;background:var(--bg);color:var(--ink);font-family:Vazirmatn,system-ui,sans-serif;line-height:1.85;font-size:16px}
.en{font-family:Nunito,system-ui,sans-serif;direction:ltr;unicode-bidi:isolate;font-weight:700;color:#3a5fb0}
header.top{background:linear-gradient(135deg,#ffd9c7,#ffe9b8 55%,#d6ecff);padding:calc(22px + env(safe-area-inset-top)) calc(18px + env(safe-area-inset-right)) 18px calc(18px + env(safe-area-inset-left))}
header.top h1{margin:0;font-size:24px;font-weight:800}
header.top p{margin:4px 0 0;color:#5b4f47;font-size:14px}
nav{position:sticky;top:0;z-index:10;background:rgba(255,250,243,.96);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
nav .bar{display:flex;gap:6px;overflow-x:auto;padding:10px 12px;scrollbar-width:none}
nav .bar::-webkit-scrollbar{display:none}
nav a{flex:0 0 auto;text-decoration:none;color:var(--ink);background:#fff;border:1px solid var(--line);padding:7px 13px;border-radius:999px;font-size:14px;font-weight:500;white-space:nowrap}
nav a.on{background:var(--brand);color:#fff;border-color:var(--brand)}
main{max-width:980px;margin:0 auto;padding:18px calc(14px + env(safe-area-inset-right)) calc(80px + env(safe-area-inset-bottom)) calc(14px + env(safe-area-inset-left))}
section.view{display:none}
section.view.on{display:block;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1}}
h2{font-size:22px;margin:6px 0 6px;font-weight:800}
h3{font-size:18px;margin:18px 0 8px;font-weight:700}
h4{font-size:16px;margin:14px 0 6px;font-weight:700}
p.lead{color:var(--muted);margin-top:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;text-decoration:none;color:inherit;display:block;transition:transform .15s}
.tile:hover{transform:translateY(-2px)}
.tile .ic{font-size:28px}
.tile b{display:block;font-size:16px;margin-top:4px}
.tile span{font-size:13px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;cursor:pointer;font:inherit;font-size:14px}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin:12px 0}
.card.tint{border-right:6px solid var(--c,#e86a4f)}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin:10px 0}
.fact{background:var(--soft);border-radius:14px;padding:10px 12px;font-size:14px}
.fact b{display:block;font-size:13px;color:var(--brand)}
.act{border-top:1px dashed var(--line);padding:12px 0}
.act:first-of-type{border-top:0}
.act .t{font-weight:700}
.act .phr{display:inline-block;background:#eef4ff;border-radius:8px;padding:1px 8px;margin:4px 0;font-size:14px}
.act p{margin:4px 0;font-size:15px}
ul.clean{padding-right:20px;margin:6px 0}
ul.clean li{margin:3px 0}
.warn{background:#fff6e0;border:1px solid #f3dc9c;border-radius:14px;padding:12px 14px;font-size:14px}
.ok{background:#eaf8ef;border:1px solid #bfe6cc;border-radius:14px;padding:12px 14px;font-size:14px}
.avoid li::marker{content:"✕  ";color:#c9483a}
.do li::marker{content:"✓  ";color:#2f9e5a}
table{width:100%;border-collapse:collapse;font-size:14px;background:#fff;border-radius:14px;overflow:hidden}
th,td{border-bottom:1px solid var(--line);padding:9px 10px;text-align:right;vertical-align:top}
th{background:#fbf3e8}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px}
.stars{color:#f0a020;letter-spacing:2px;white-space:nowrap}
.bi{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.bi .enbox{direction:ltr;text-align:left;font-family:Nunito,system-ui,sans-serif;font-weight:600;font-size:15px;background:#f4f8ff;border-radius:12px;padding:10px 12px;line-height:1.6}
.bi .fabox{background:#fff7f0;border-radius:12px;padding:10px 12px;font-size:15px}
@media (max-width:640px){.bi{grid-template-columns:1fr}}
a.src{color:var(--brand2);font-weight:600}
label{font-size:14px;font-weight:600;display:block;margin:10px 0 4px}
select,textarea,input[type=text]{width:100%;font:inherit;border:1px solid #e2d8c8;border-radius:12px;padding:9px 11px;background:#fff}
textarea{min-height:130px;resize:vertical}
.ltr{direction:ltr;text-align:left}
button.go{font:inherit;font-weight:700;background:var(--brand);color:#fff;border:0;border-radius:12px;padding:11px 20px;cursor:pointer;margin-top:12px}
button.go:disabled{opacity:.55}
button.ghost{font:inherit;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 14px;cursor:pointer;margin:12px 6px 0 0}
.out{white-space:pre-wrap;background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:12px;min-height:40px;font-size:15px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:640px){.two{grid-template-columns:1fr}}
details{background:#fff;border:1px solid var(--line);border-radius:var(--r);margin:10px 0;padding:0 16px}
details summary{cursor:pointer;padding:14px 0;font-weight:700;font-size:17px;list-style:none}
details summary::-webkit-details-marker{display:none}
details summary::after{content:"＋";float:left;color:var(--muted)}
details[open] summary::after{content:"－"}
details>div{padding-bottom:14px}
.pill{display:inline-block;font-size:12px;border-radius:999px;padding:1px 9px;background:#f1ece4;color:#5b524a;margin-left:4px}
.out,.act,.card,a.src,.fabox,.enbox{overflow-wrap:anywhere;word-break:break-word}
main{overflow-x:clip}
.calg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:10px}.calh{text-align:center;font-size:12px;color:var(--muted)}.calc{position:relative;border:1px solid var(--line);background:#fff;border-radius:10px;padding:4px 0 2px;font:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;min-height:54px;color:var(--ink)}.calc b{font-size:15px;line-height:1.3}.calc small{font-size:10px;color:var(--muted);font-family:Nunito,sans-serif;line-height:1.2}.calc i{font-style:normal;font-size:11px;line-height:1.2}.calc.occ{background:#eaf8ef;border-color:#bfe6cc}.calc.calm{background:#f1ecfa;border-color:#d8ccef}.calc.today{border:2px solid var(--brand)}.calc.sel{background:var(--ink);color:#fff}.calc.sel small{color:#ddd}
footer{color:var(--muted);font-size:13px;text-align:center;padding:20px}
</style>
</head>
<body>
<header class="top">
  <h1>🌈 میز کار معلم زبان کودک</h1>
  <p>آموزش انگلیسی به کودکان ۳ تا ۷ سال · هوش‌های چندگانه · نیازهای ویژه · رویکردهای آموزشی</p>
</header>
<nav><div class="bar" id="navbar"></div></nav>
<main id="app"></main>
<footer>این سایت نسخه‌ی اول است و هر بخش قابل گسترش است. 🌱</footer>

<script>
/* ============================ DATA ============================ */

const AGES = [
 {age:"۳ سال", key:"3", c:"#ff9f7a",
  traits:["تمرکز حدود ۳ تا ۶ دقیقه","یادگیری از راه حس، حرکت و تکرار","بازی کنار هم (موازی)، نه هنوز با هم","ممکن است مدتی فقط گوش کند و حرف نزند"],
  goal:"درک شنیداری مهم‌تر از گفتن است. کودک با حرکت، اشاره یا یک کلمه پاسخ می‌دهد. واژگان پایه: سلام و خداحافظ، رنگ‌ها، حیوانات، اعضای بدن، اعداد ۱ تا ۵.",
  acts:[
   {t:"آهنگ سلام با حرکت دست",en:"Hello, hello, how are you?",d:"هر جلسه با یک آهنگ ثابت شروع کنید. تکرار ثابت به بچه‌ی سه‌ساله امنیت می‌دهد و آغاز کلاس را برایش قابل پیش‌بینی می‌کند."},
   {t:"کیسه‌ی رازآلود",en:"What's in the bag? It's a ball!",d:"یک اسباب‌بازی را در کیسه‌ی پارچه‌ای بگذارید. بچه دست می‌برد و لمس می‌کند. شما با هیجان اسمش را می‌گویید و بچه‌ها تکرار می‌کنند."},
   {t:"دستورهای حرکتی ساده (TPR)",en:"Jump! Clap! Sit down!",d:"دستور را بگویید و خودتان انجام دهید. بچه‌ها تقلید می‌کنند. کم‌کم حرکت را حذف کنید تا فقط از روی شنیدن انجام دهند."},
   {t:"شکار رنگ",en:"Red! Find something red!",d:"یک رنگ را بگویید. بچه‌ها در کلاس می‌گردند و چیزی به همان رنگ پیدا می‌کنند. هر جلسه فقط یک یا دو رنگ."},
   {t:"عروسک دستیِ انگلیسی‌زبان",en:"Hi! I'm Teddy. I only speak English!",d:"یک عروسک داشته باشید که «فقط انگلیسی بلد است». بچه‌ها برای حرف زدن با او انگیزه پیدا می‌کنند و اضطرابشان کمتر می‌شود."},
   {t:"صدای حیوانات",en:"What does the cow say? Moo!",d:"کارت حیوان را نشان دهید، صدا و ادایش را درآورید. بعد بچه‌ها صدا را درمی‌آورند و شما اسم حیوان را می‌گویید."}],
  tips:["هر فعالیت ۳ تا ۵ دقیقه باشد، نه بیشتر.","روتین ثابت: آهنگ سلام، بازی حرکتی، قصه، آهنگ خداحافظی.","از بچه جمله نخواهید. دوره‌ی سکوت طبیعی است و به‌معنای یاد نگرفتن نیست."]},
 {age:"۴ سال", key:"4", c:"#ffc24b",
  traits:["تمرکز حدود ۵ تا ۱۰ دقیقه","پرسیدن زیاد و عاشق «چرا؟»","بازی وانمودی (خاله‌بازی، مغازه‌بازی)","شروع بازی کردن با دیگران"],
  goal:"گفتن کلمه‌های تکی و عبارت‌های آماده که یکجا حفظ می‌شوند. مثل: I like…، Can I have…?، My name is…. احساسات، غذاها، اسباب‌بازی‌ها.",

   {t:"سایمون میگه (نسخه‌ی ساده)",en:"Simon says touch your nose!",d:"اول بدون حذف کردن کسی بازی کنید. هدف گوش دادن و اعضای بدن است، نه برنده شدن."},
   {t:"قصه‌ی تکرارشونده با وسیله",en:"Brown bear, what do you see?",d:"قصه‌هایی را انتخاب کنید که یک جمله در آن‌ها تکرار می‌شود. بچه‌ها خیلی زود جمله‌ی تکراری را با شما می‌گویند."},
   {t:"صورتک احساسات",en:"I'm happy! / I'm sad.",d:"کارت صورتک‌ها را نشان دهید و ادایشان را درآورید. هر روز اول کلاس بپرسید: How are you today?"},
   {t:"دسته‌بندی میوه‌ها",en:"Red apple, yellow banana.",d:"میوه‌ها را بر اساس رنگ در سبدها بچینید. رنگ و اسم میوه با هم تمرین می‌شود."},
   {t:"رقص و ایست",en:"Dance… and FREEZE!",d:"موزیک پخش کنید. وقتی قطع شد بگویید Freeze. نسخه‌ی پیشرفته‌تر: Freeze like a cat!"}],
  tips:["بازی وانمودی بهترین فرصت برای مکالمه‌ی واقعی است.","هر جلسه حداقل یک قصه بگویید.","به هر تلاش برای حرف زدن واکنش گرم نشان دهید، حتی اگر اشتباه باشد."]},
 {age:"۵ سال", key:"5", c:"#7fd18b",
  traits:["تمرکز حدود ۱۰ تا ۱۵ دقیقه","قانون بازی را می‌فهمد","علاقه به کار گروهی","علاقه به حروف و اعداد"],
  goal:"جمله‌های کوتاه، سؤال و جواب ساده و شروع فونیکس (صدای حروف، نه اسم حروف). حروف اضافه‌ی مکان in، on و under.",
  acts:[
   {t:"فونیکس با حرکت",en:"/a/ /a/ apple!",d:"برای صدای هر حرف یک حرکت بدنی بسازید (مثلاً برای /s/ دست مثل مار حرکت کند). حرکت به یادآوری کمک زیادی می‌کند."},
   {t:"بازی صفحه‌ای با تاس",en:"One, two, three… my turn!",d:"یک صفحه‌ی مارپله‌ی ساده با تصویر. با تاس شمردن به انگلیسی و نوبت‌گیری تمرین می‌شود."},
   {t:"نشان بده و تعریف کن",en:"This is my car. It's blue.",d:"هر بچه از خانه یک وسیله می‌آورد و با یکی دو جمله معرفی‌اش می‌کند. بقیه یک سؤال می‌پرسند."},
   {t:"گنج‌یابی",en:"Is it under the table? Yes! / No!",d:"یک عروسک را قایم کنید. بچه‌ها با in، on و under حدس می‌زنند. بعد نوبت خودشان است که قایم کنند."},
   {t:"نقش‌بازی دکتر و بیمار",en:"What's wrong? – My head hurts.",d:"با کیف دکتر اسباب‌بازی. اعضای بدن و جمله‌های مکالمه در یک موقعیت واقعی تمرین می‌شود."},
   {t:"بکش و تعریف کن",en:"This is my mom. She is tall.",d:"بچه‌ها خانواده‌شان را می‌کشند و معرفی می‌کنند. این فعالیت هم واژگان را تقویت می‌کند و هم علاقه‌ی شخصی را."}],
  tips:["رقابت دوستانه و گروهی جواب می‌دهد، رقابت فردی نه.","فونیکس را بازی‌وار و کوتاه نگه دارید.","کارهای بچه‌ها را با برچسب انگلیسی روی دیوار بزنید."]},
 {age:"۶ سال", key:"6", c:"#5bb6e8",

  tips:["خواندن را با بازی شروع کنید نه برگه.","هر بچه سرعت خودش را دارد. مقایسه نکنید.","کتابخانه‌ی کوچک کلاسی با کتاب‌های تصویری انگلیسی بسازید."]},
 {age:"۷ سال", key:"7", c:"#a58bf0",

  acts:[

   {t:"مصاحبه با دوست",en:"What's your favorite food?",d:"بچه‌ها دوبه‌دو از هم سؤال می‌پرسند و جواب را در یک جدول تصویری علامت می‌زنند. بعد گزارش می‌دهند."},
   {t:"علوم به انگلیسی: غرق یا شناور",en:"I think it will sink. – It floats!",d:"اول پیش‌بینی کنند و بعد آزمایش. زبان در دل یک تجربه‌ی واقعی یاد گرفته می‌شود."},
   {t:"کتاب کوچک من",en:"My Mini Book: All About Me",d:"یک کتابچه‌ی چندصفحه‌ای: اسمم، خانواده‌ام، غذای مورد علاقه‌ام. هر صفحه یک جمله و یک نقاشی."},

   {t:"سایمون میگه",en:"Simon says jump! … Jump! (Oops!)",d:"قلب این بازی مهار تکانه است: فقط وقتی Simon says شنیدی عمل کن. اشتباه را با خنده بپذیرید و کسی را حذف نکنید."},
   {t:"صبر کن تا بگم Go!",en:"Ready… steady… BANANA! … Ready, steady… GO!",d:"بچه‌ها آماده‌ی دویدن یا پریدن‌اند. شما گاهی به‌جای Go کلمه‌ی دیگری می‌گویید. بازی خیلی خنده‌دار است و صبر کردن را تمرین می‌دهد."},
   {t:"تکنیک لاک‌پشت",en:"Stop like a turtle. Breathe. Think.",d:"وقتی عصبانی است، مثل لاک‌پشت به لاکش برود: دست‌ها روی بدن، سه نفس عمیق. این را در حالت آرام بارها تمرین کنید تا وقت عصبانیت به کار بیاید."},
   {t:"چوب صحبت",en:"Who has the talking stick?",d:"فقط کسی که چوب یا عروسک دستش است حرف می‌زند. نوبت را قابل دیدن می‌کند."},
   {t:"حرکت آهسته",en:"Walk in slow motion… sloooow…",d:"همه‌ی حرکات را خیلی آهسته انجام دهند. کنترل بدن را تمرین می‌کند و خیلی بامزه است."},
   {t:"رقص و ایست",en:"Dance! … FREEZE!",d:"وقتی موزیک قطع شد، توقف کامل. می‌توانید شکل توقف را هم تعیین کنید: Freeze like a frog!"}],
  avoid:["واکنش با صدای بلند یا عصبانیت (الگوی تکانشی)","تنبیه‌های طولانی که به رفتار ربطی ندارند","انتظار صبر طولانی از همان روز اول"]},
 {k:"autism", ic:"🧩", fa:"اوتیسم", en:"Autism Spectrum", c:"#3d8bfd",
  about:"اوتیسم یک طیف است و هر کودک اوتیسمی متفاوت است. معمولاً در ارتباط اجتماعی و گفتار تفاوت دارد، به روتین و پیش‌بینی‌پذیری نیاز دارد، ممکن است به صدا و نور و لمس حساس باشد و علاقه‌های خیلی خاص و عمیق داشته باشد. بعضی بچه‌ها جمله‌ها را عیناً تکرار می‌کنند که پل خوبی برای یادگیری زبان است.",
  room:["برنامه‌ی تصویری «اول این، بعد آن» (First / Then)","جای ثابت برای نشستن","گوشه‌ی آرام با نور کم و صدای کم","کاهش شلوغی دیداری و صدای زیاد"],
  principles:["جمله‌های کوتاه و ساده و همیشه یکسان: Sit down, please","پشتیبانی تصویری برای همه‌چیز (کارت تصویر کنار کلمه)","از علاقه‌ی خاص کودک به‌عنوان در ورود استفاده کنید","قبل از تغییر فعالیت هشدار بدهید: Two more minutes","بعد از سؤال ۵ تا ۱۰ ثانیه صبر کنید. پردازش زمان می‌برد","هر نوع پاسخ را بپذیرید: اشاره، کارت، کلمه"],
  acts:[
   {t:"تخته‌ی اول ـ بعد",en:"First song, then blocks.",d:"دو تصویر کنار هم: فعالیت لازم و فعالیت مورد علاقه. اضطراب کم می‌شود و همکاری بیشتر."},
   {t:"واژگان از دل علاقه‌ی خاص",en:"Red car! Blue car! Fast car!",d:"اگر عاشق ماشین است، رنگ‌ها و اعداد و صفت‌ها را با ماشین یاد بدهید. علاقه موتور یادگیری اوست."},
   {t:"آهنگ با مکث قابل پیش‌بینی",en:"Twinkle, twinkle, little… (star!)",d:"آهنگ آشنا را بخوانید و قبل از کلمه‌ی آخر مکث کنید. فرصت امنی برای گفتن است."},
   {t:"غلتاندن توپ نوبتی",en:"My turn… your turn!",d:"دوبه‌دو توپ را برای هم بغلتانید و نوبت را بگویید. پایه‌ی تعامل اجتماعی، با فشار کم."},
   {t:"جعبه‌ی حسی با کلمه",en:"Find the duck! Find the spoon!",d:"ظرفی پر از ماکارونی درشت یا کاغذ خردشده با اسباب‌بازی‌های بزرگ‌تر از ۴ سانت داخلش، با نظارت دائم. حس لمسی آرام‌کننده است و کلمه هم یاد گرفته می‌شود. (اگر به لمس حساس است، با قاشق کار کند.)"},
   {t:"جفت کردن تصویر و کلمه",en:"Match: apple – apple",d:"کارت‌های جفت. فعالیت‌های ساختارمند و قابل پیش‌بینی برای بسیاری از این بچه‌ها لذت‌بخش است."}],
  avoid:["اجبار به نگاه کردن در چشم","متوقف کردن حرکات تکراری مثل تکان دادن دست، مگر خطرناک باشد","تغییر ناگهانی برنامه بدون هشدار","کلاس پرسروصدا و شلوغ","کنایه، طنز مبهم و جمله‌های دوپهلو","لمس بدون اجازه"]},
 {k:"ld", ic:"🔤", fa:"اختلال یادگیری خاص", en:"Specific Learning Disorder", c:"#9b6bdf",
  about:"اختلال یادگیری (مثل نارساخوانی) معمولاً بعد از شروع مدرسه به‌طور رسمی تشخیص داده می‌شود. در سنین پیش‌دبستانی بیشتر از «نشانه‌های در معرض خطر» حرف می‌زنیم: سختی در قافیه، یاد گرفتن صدای حروف، به خاطر سپردن ترتیب‌ها (روزهای هفته) یا اسم رنگ‌ها. شناختن زودهنگام و آموزش درست تفاوت بزرگی ایجاد می‌کند.",
  room:["ابزارهای لمسی برای حروف (حروف شنی، خمیر، سینی شن)","پوستر حروف با تصویر در دید بچه‌ها"],
  principles:["آموزش چندحسی: ببین، بگو، لمس کن، حرکت کن، همه هم‌زمان","تکرار زیاد ولی هر بار به شکل تازه","گام‌های خیلی کوچک و موفقیت‌های پشت سر هم","تمرکز روی آگاهی واجی (شنیدن صداها) قبل از حروف","هیچ‌وقت مقایسه با بقیه"],
  acts:[
   {t:"حروف با خمیر و شن",en:"Make an 'S'. Sss… snake!",d:"حرف را با خمیر می‌سازند یا با انگشت روی شن می‌کشند و هم‌زمان صدایش را می‌گویند."},
   {t:"دست زدن برای هجاها",en:"El-e-phant! 3 claps!",d:"تقسیم کلمه به بخش‌ها، پایه‌ی خواندن است. با کلمه‌های یک‌هجایی شروع کنید."},
   {t:"جفت‌های هم‌قافیه",en:"Does 'cat' rhyme with 'hat'? Thumbs up!",d:"اگر هم‌قافیه بود شست بالا، اگر نه پایین. ساده و بدون فشار."},
   {t:"شکار صدای اول",en:"Find something that starts with /m/!",d:"در کلاس دنبال چیزهایی بگردند که با آن صدا شروع می‌شوند."},
   {t:"نوشتن در هوا",en:"Let's write 'b' in the sky!",d:"با دست کشیده شکل حرف را در هوا بزرگ بکشند. حافظه‌ی حرکتی به یادآوری کمک می‌کند."},
   {t:"بازی حافظه با کارت",en:"Turn over two cards… a match!",d:"حافظه‌ی کاری را تقویت می‌کند. با ۴ جفت شروع کنید."}],
  avoid:["برگه‌های تمرین زیاد و تکراری","عجله برای خواندن و نوشتن","خواندن بلند اجباری جلوی جمع"]},
 {k:"dd", ic:"🌱", fa:"تأخیر رشدی", en:"Developmental Delay", c:"#2fb380",
  about:"کودک در یک یا چند حوزه (حرکتی، زبانی، شناختی، اجتماعی) از همسالانش عقب‌تر است. مهم‌ترین اصل این است که فعالیت را بر اساس سطح رشدی کودک انتخاب کنید، نه سن تقویمی‌اش. اگر بچه‌ی پنج‌ساله در سطح سه‌سالگی است، از فعالیت‌های بخش «۳ سال» شروع کنید.",
  room:["وسایل ساده، بزرگ و امن","فضای کافی برای حرکت"],
  principles:["هر مهارت را به گام‌های خیلی کوچک بشکنید","اول شما انجام دهید (الگو)، بعد با هم، بعد خودش","تقویت فوری و شاد برای هر پیشرفت کوچک","تکرار، تکرار، تکرار","پیشرفت را با خود کودک مقایسه کنید، نه با بقیه"],
  acts:[
   {t:"دالی‌موشه با کلمه",en:"Where's Teddy? … Here he is!",d:"عروسک را پشت پارچه قایم کنید و ظاهر کنید. توجه مشترک و لذت از زبان را می‌سازد."},
   {t:"اسباب‌بازی علت‌ومعلول",en:"Push! … Go!",d:"ماشینی که با فشار حرکت می‌کند یا جعبه‌ای که صدا می‌دهد. کلمه با نتیجه پیوند می‌خورد."},
   {t:"انتخاب از دو گزینه",en:"Apple or banana?",d:"دو چیز را نشان دهید. کودک با اشاره یا کلمه انتخاب می‌کند. به او قدرت ارتباط می‌دهد."},
   {t:"حباب‌بازی",en:"More bubbles? … Pop! Pop!",d:"شما حباب درست کنید و صبر کنید تا با اشاره یا کلمه More را درخواست کند."},
   {t:"آماده، حاضر، برو!",en:"Ready… steady… GO!",d:"قبل از غلتاندن توپ مکث کنید تا خودش Go را بگوید. انتظار کوتاه، انگیزه‌ی گفتن می‌سازد."},
   {t:"آهنگ با حرکت دست",en:"Clap, clap, clap your hands",d:"آهنگ‌های خیلی ساده با حرکت‌های تکراری."}],
  avoid:["فعالیت‌های مناسب سن تقویمی که از سطح او بالاتر است","عجله و فشار","مقایسه با همسالان"]},
 {k:"speech", ic:"🗣️", fa:"تأخیر گفتار و زبان", en:"Speech & Language Delay", c:"#ff6fa3",
  about:"کودک دیرتر از همسالانش حرف می‌زند، واژگان کمتری دارد یا تلفظش نامفهوم است. یک نکته‌ی مهم: طبق پژوهش‌ها، یاد گرفتن زبان دوم باعث تأخیر یا اختلال زبانی نمی‌شود. با این حال برای این بچه‌ها حتماً با گفتاردرمانگرشان هماهنگ باشید.",
  room:["کتاب‌های تصویری بزرگ","کارت‌های تصویری برای انتخاب و درخواست"],
  principles:["هر نوع پاسخ را بپذیرید: اشاره، صدا، نیمه‌کلمه","گسترش دادن: کودک می‌گوید car و شما می‌گویید Blue car! Fast car!","اشتباه را مستقیم اصلاح نکنید. فقط شکل درست را با لبخند تکرار کنید","بعد از سؤال صبر کنید و سکوت را پر نکنید","صورتتان هم‌سطح صورت کودک باشد تا دهان شما را ببیند"],
  acts:[
   {t:"عروسک حرف‌زن",en:"Teddy is hungry! What does he want?",d:"بچه‌ها گاهی با عروسک راحت‌تر از آدم حرف می‌زنند."},
   {t:"خرابکاری بامزه",en:"Oh no! Where's the glue?",d:"عمداً یک وسیله‌ی لازم را ندهید (مثلاً قلم‌مو بدون رنگ). کودک برای درخواست انگیزه پیدا می‌کند."},
   {t:"پر کردن جای خالی آهنگ",en:"The wheels on the bus go round and… (round!)",d:"کلمه‌ی آخر را جا بیندازید تا کودک کامل کند."},
   {t:"نام‌گذاری کتاب تصویری",en:"Look! A dog! What's this?",d:"کتاب را با هم ورق بزنید، اشاره کنید و اسم ببرید. فشار نیاورید. فقط فرصت بدهید."},
   {t:"صداهای دهانی بامزه",en:"The snake says sss… the bee says zzz…",d:"صدای حیوانات و وسایل نقلیه، تمرین بی‌فشار عضلات دهان و صداهاست."}],
  avoid:["اجبار به تکرار «بگو …!»","تمام کردن جمله‌ی کودک به‌جای او قبل از اینکه فرصت کافی داشته باشد","تمسخر یا خندیدن به تلفظ"]},
 {k:"sensory", ic:"✋", fa:"اختلال پردازش حسی", en:"Sensory Processing Difficulties", c:"#f0a020",
  about:"مغز کودک ورودی‌های حسی (صدا، نور، لمس، حرکت) را متفاوت پردازش می‌کند. بعضی بچه‌ها حساس‌اند و از صدای بلند یا لمس فرار می‌کنند. بعضی جستجوگرند و مدام دنبال پریدن، فشار دادن و لمس کردن‌اند. این مشکل اغلب همراه اوتیسم یا بیش‌فعالی دیده می‌شود.",
  room:["گوشه یا چادر آرام","هدفون کاهش صدا برای بچه‌های حساس","وسایل حسی: توپ فشاری، کوسن"],
  principles:["رفتار را به‌عنوان نیاز حسی ببینید، نه لجبازی","برای جستجوگرها: فعالیت‌های «کار سنگین» (حمل، هل دادن)","برای حساس‌ها: قبل از صدای بلند هشدار بدهید و حق انتخاب بدهید","هماهنگی با کاردرمانگر کودک"],
  acts:[
   {t:"کار سنگین",en:"Can you carry the books, please? Push the chair!",d:"حمل کتاب یا هل دادن جعبه آرام‌کننده است و در همان حال دستور انگلیسی هم تمرین می‌شود."},
   {t:"یوگای حیوانات",en:"Be a cat! Stretch like a cat…",d:"حالت‌های یوگا با اسم حیوان. حرکت آرام و کنترل‌شده تنظیم حسی خوبی است."},
   {t:"حروف با خمیر",en:"Squeeze, roll, make an 'O'!",d:"فشار دادن خمیر ورودی حسی خوبی است و حروف یاد گرفته می‌شود."},
   {t:"جعبه‌ی حسی",en:"Find the yellow ball!",d:"با ماکارونی درشت یا کاغذ خردشده و اشیای بزرگ‌تر از ۴ سانت، با نظارت دائم. برای جستجوگرها عالی است. برای حساس‌ها اختیاری و با قاشق باشد."},
   {t:"چادر آرام با کتاب",en:"Quiet time in the tent",d:"جایی امن برای وقتی که محیط زیادی شلوغ می‌شود."}],
  avoid:["مجبور کردن به لمس یا تحمل صدای آزاردهنده","تنبیه برای رفتار حسی","کلاس خیلی پرنور و پرسروصدا"]},
 {k:"anxiety", ic:"🫧", fa:"اضطراب و سکوت انتخابی", en:"Anxiety & Selective Mutism", c:"#5bb6e8",
  about:"کودکی که در خانه حرف می‌زند ولی در کلاس ساکت است، یا از اشتباه کردن خیلی می‌ترسد. سکوت انتخابی یعنی کودک در موقعیت‌های خاص نمی‌تواند حرف بزند. این از سر لجبازی نیست. او واقعاً قفل می‌شود. فشار آوردن اوضاع را بدتر می‌کند. توجه: سکوتِ ماه اول ورود به کلاس، یا «دوره‌ی سکوت» کودکی که زبان جدید یاد می‌گیرد، طبیعی است و سکوت انتخابی نیست.",
  room:["جای نشستن کنار یک دوست صمیمی","یک گوشه‌ی دنج"],
  principles:["هرگز برای حرف زدن فشار نیاورید","پاسخ غیرکلامی را کاملاً بپذیرید: اشاره، سر تکان دادن، نقاشی","همخوانی گروهی امن‌تر از گفتن تنهایی است","تحسین را آرام و خصوصی کنید، نه جلوی جمع","پله‌پله: اول اشاره، بعد صدای حیوان، بعد زمزمه، بعد کلمه"],
  acts:[
   {t:"عروسک واسطه",en:"Can you whisper it to Teddy?",d:"کودک در گوش عروسک می‌گوید و عروسک (یعنی شما) به کلاس اعلام می‌کند."},
   {t:"همخوانی گروهی",en:"Let's all sing together!",d:"صدای کودک در صدای جمع گم می‌شود و امنیت دارد."},
   {t:"نشان بده",en:"Show me the red one!",d:"پاسخ با اشاره یا برداشتن کارت. شرکت کامل بدون نیاز به حرف زدن."},
   {t:"بازی زمزمه",en:"Let's whisper the colors…",d:"همه‌ی کلاس زمزمه می‌کنند. زمزمه پله‌ی اول گفتن است."},
   {t:"جواب با نقاشی",en:"Draw your favorite animal.",d:"کودک بدون حرف زدن در فعالیت شرکت می‌کند و موفقیت را تجربه می‌کند."}],
  avoid:["گفتن جمله‌هایی مثل «چرا حرف نمی‌زنی؟»","ذوق‌زدگی بلند وقتی بالاخره حرف زد","پرسیدن سؤال جلوی کل کلاس از او"]},
 {k:"down", ic:"💛", fa:"سندرم داون", en:"Down Syndrome", c:"#ffb020",
  about:"بسیاری از بچه‌های سندرم داون یادگیرنده‌های دیداری قوی‌اند و از الگوبرداری اجتماعی خوب یاد می‌گیرند، ولی پردازش شنیداری و حافظه‌ی کوتاه‌مدت شنیداری‌شان ضعیف‌تر است. مشکلات شنوایی هم در آن‌ها شایع است. تصویر و حرکت دست (اشاره) کمک خیلی بزرگی می‌کند. ایمنی: قبل از حرکات چرخش گردن، معلق زدن و وارو، با والدین درباره‌ی وضعیت مهره‌های گردن و قلب کودک هماهنگ کنید.",
  room:["نشستن جلوی کلاس، نزدیک معلم","تصویرهای بزرگ و واضح"],
  principles:["هر کلمه همراه تصویر و حرکت دست (اشاره)","جمله‌های کوتاه و آهسته","الگودهی و تقلید (نقطه‌ی قوت این بچه‌ها)","تکرار زیاد در موقعیت‌های مختلف","زمان بیشتر برای پاسخ"],

function route(){
 let h=(location.hash||"#home").slice(1);
 let anchor=null;
 if(h.startsWith("g-")){anchor=h;h="gardner"}
 else if(h.startsWith("n-")){anchor=h;h="needs"}
 else if(h.startsWith("a-")){anchor=h;h="approaches"}
 if(!RENDER[h]) h="home";
 document.querySelectorAll("nav a").forEach(a=>a.classList.toggle("on",a.dataset.k===h||(!!window.KNOW_K&&window.KNOW_K.includes(h)&&a.dataset.k==="knowledge")));
 const on=document.querySelector("nav a.on"); if(on) on.scrollIntoView({inline:"center",block:"nearest"});
 $("#app").innerHTML=`<section class="view on">${RENDER[h]()}</section>`;
 if(h==="assistant") wireAssistant();
 if(anchor){const el=document.getElementById(anchor); if(el){el.open=true; setTimeout(()=>el.scrollIntoView({behavior:"smooth",block:"start"}),50);} }
 else window.scrollTo(0,0);
}
document.addEventListener("click",e=>{

});

/* ============================ AI (sample capability) ============================ */
let samplePromise = (window.claude && window.claude.use) ? window.claude.use("sample") : Promise.resolve(null);
async function getSample(){ try{ return await samplePromise; }catch(e){ return null; } }

async function wireAssistant(){
 const sample = await getSample();
 if(!sample){ const n=$("#noAI"); if(n) n.style.display="block"; ["#genBtn","#trBtn"].forEach(s=>{const x=$(s); if(x) x.disabled=true}); return; }
 const genBtn=$("#genBtn"); if(!genBtn) return;
 genBtn.onclick=async()=>{
  const out=$("#genOut"); out.style.display="block"; out.textContent="در حال فکر کردن…"; genBtn.disabled=true;
  const p=`You are an expert early-childhood English teacher trainer. Write ONLY in Persian (Farsi), but put every English phrase the teacher will say to children in English.
Create: ${$("#sType").value}
Children's age: ${$("#sAge").value}
Topic / vocabulary: ${$("#sTopic").value||"به انتخاب خودت، یک موضوع مناسب"}
Gardner intelligence focus: ${$("#sInt").value}
Teaching approach: ${$("#sApp").value}
Special need present in class: ${$("#sNeed").value}
Requirements: play-based, practical for an Iranian preschool classroom with limited budget, give timings, materials list, exact English teacher phrases, and if a special need is present include specific adaptations for that child. Use short headings and bullet points. Plain text, no markdown tables.`;
  try{
   const r=await sample(p,{modelTier:"default",cache:false,onText:({text})=>{out.textContent=text}});
   out.textContent=r.text; $("#copyGen").style.display="inline-block";
  }catch(err){ out.textContent = err && err.code==="rate_limited" ? "کمی صبر کنید و دوباره امتحان کنید." : "متأسفانه ساخته نشد. دوباره امتحان کنید."; }
  genBtn.disabled=false;
 };
 $("#copyGen").onclick=async()=>{try{await navigator.clipboard.writeText($("#genOut").textContent); $("#copyGen").textContent="کپی شد ✓"}catch(e){$("#copyGen").textContent="کپی نشد"}};
 const trBtn=$("#trBtn");
 trBtn.onclick=async()=>{
  const txt=$("#trIn").value.trim(); const out=$("#trOut");
  if(!txt){out.innerHTML=`<p class="warn">اول متن انگلیسی را بچسبانید.</p>`;return;}
  trBtn.disabled=true; out.innerHTML=`<div class="out">در حال ترجمه…</div>`;
  const p=`Translate the following English text into fluent, natural Persian (Farsi) for an Iranian preschool English teacher. Split the text into paragraphs. Return ONLY JSON of the form {"pairs":[{"en":"original paragraph","fa":"Persian translation"}]${$("#trSum").checked?',"summary":"a 3-4 sentence Persian summary","classroom":"2-4 practical Persian tips for applying this in a 3-7 year-old English class"':''}}.
TEXT:
${txt.slice(0,12000)}`;
  try{
   const j=await sample.json(p,{modelTier:"default"});
   let html=(j.pairs||[]).map(x=>`<div class="bi" style="margin-top:10px"><div class="enbox">${esc(x.en)}</div><div class="fabox">${esc(x.fa)}</div></div>`).join("");
   if(j.summary) html=`<div class="ok" style="margin-top:12px"><b>خلاصه:</b> ${esc(j.summary)}</div>`+html;
   if(j.classroom) html+=`<div class="card" style="margin-top:12px"><b>👉 کاربرد در کلاس:</b><div style="white-space:pre-wrap">${esc(Array.isArray(j.classroom)?j.classroom.join("\n"):j.classroom)}</div></div>`;
   out.innerHTML=html||`<p class="warn">ترجمه خالی بود. دوباره امتحان کنید.</p>`;
  }catch(err){ out.innerHTML=`<p class="warn">${err && err.code==="rate_limited"?"کمی صبر کنید و دوباره امتحان کنید.":"ترجمه انجام نشد. دوباره امتحان کنید."}</p>`; }
  trBtn.disabled=false;
 };
}

/* ---------- helpers ---------- */
function chips(field, options, multi, val){
 return `<div class="chips">${options.map(([v,l])=>{
   const on = multi ? (val||[]).includes(v) : String(val)===String(v);
   return `<button class="chip ${on?"on":""}" data-f="${field}" data-v="${esc(v)}" ${multi?'data-m="1"':''}>${l}</button>`;
 }).join("")}</div>`;
}
function rng(seed){ let a = seed>>>0; return ()=>{ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
const uniq = a=>[...new Set(a)];
function songLink(k){ const s=SONGS[k]; if(!s) return ""; return `<a class="src" href="${yt(s.q)}" target="_blank" rel="noopener">🎵 ${esc(s.t)}</a>`; }
function allTraits(c){ return uniq([...(c.traits||[]), ...(c.kids||[]).flatMap(k=>k.traits||[])]).filter(t=>TRAITS[t]); }

function analysis(c){
 syncSize(c);
 const ageN = c.age==="mix" ? 4 : +c.age;
 const d = DEV[Math.min(Math.max(ageN-3,0),4)];
 const span = c.age==="mix" ? "۵ تا ۱۰" : ({3:"۳ تا ۶",4:"۵ تا ۱۰",5:"۱۰ تا ۱۵",6:"۱۵ تا ۲۰",7:"حدود ۲۰"})[ageN];
 const tr = allTraits(c);
 const sci = [
  `<b>رشد شناختی ${c.age==="mix"?"(سنین مختلط)":d.age}:</b> ${esc(d.mind)}`,
  `<b>رشد زبانی:</b> ${esc(d.lang)}`,
  `<b>مدت تمرکز:</b> بچه‌های این سن معمولاً ${span} دقیقه روی یک فعالیت تمرکز دارند. برای جلسه‌ی ${faN(c.dur)} دقیقه‌ای، فعالیت‌ها را کوتاه و متنوع نگه دارید.`,
  ageN<=6 ? "<b>پیاژه:</b> در مرحله‌ی پیش‌عملیاتی‌اند و با نماد و بازی وانمودی فکر می‌کنند. همه‌چیز را عینی، با وسیله‌ی واقعی و حرکت آموزش دهید." : "<b>پیاژه:</b> در آستانه‌ی عملیات عینی‌اند. منطق با اشیای واقعی، آزمایش و دسته‌بندی را دوست دارند.",
  "<b>ویگوتسکی:</b> فعالیت کمی بالاتر از سطح فعلی بچه‌ها باشد و شما داربست بزنید: اول الگو بدهید، بعد با هم، بعد خودشان.",
  ({zero:"<b>سطح زبان:</b> کاملاً مبتدی‌اند. دوره‌ی سکوت طبیعی است. روی درک شنیداری و پاسخ حرکتی (TPR) تمرکز کنید، نه گفتن.",beg:"<b>سطح زبان:</b> کمی آشنا هستند. عبارت‌های آماده و تکراری (chunks) مثل I like… را تمرین کنید.",mid:"<b>سطح زبان:</b> چند جمله بلدند. سؤال و جواب، قصه‌گویی و جمله‌سازی ساده را شروع کنید."})[c.level]
 ];
 if(c.age==="mix") sci.push("<b>کلاس مختلط:</b> فعالیت‌ها را پله‌ای طراحی کنید. کوچک‌ترها با حرکت و اشاره پاسخ می‌دهند و بزرگ‌ترها با کلمه و جمله. بزرگ‌ترها را «معلم کوچک» کنید.");
 tr.forEach(t=>{ if(TRAITS[t].sci) sci.push(`<b>${TRAITS[t].ic} ${esc(TRAITS[t].fa)}:</b> ${esc(TRAITS[t].sci)}`); });

 let behave = [];
 if(c.size==="large") behave.push("کلاس شلوغ: نشانه‌ی ثابت سکوت داشته باشید، مثل Class, class! – Yes, yes! یا دست بالا. پاسخ گروهی و کر بیشتر، ایستگاه‌های چرخشی در گروه‌های ۴ تا ۶ نفره، و یک دستیار کوچک برای هر گروه.");
 if(c.size==="small") behave.push("کلاس کوچک: هر بچه نوبت بیشتری دارد. از فرصت برای گفتگوی فردی و فعالیت شخصی‌شده استفاده کنید.");
 if(c.size==="mid") behave.push("کلاس متوسط: ترکیب فعالیت‌های کل کلاس با کار دوتایی و گروه‌های ۳ تا ۴ نفره بهترین نتیجه را می‌دهد.");
 behave.push("قانون‌های کلاس کم (۳ یا ۴ قانون) و تصویری باشد و هر جلسه با حرکت مرورشان کنید: Listen, Hands to myself, Be kind.");
 behave.push("رفتار خوب را با جمله‌ی مشخص ببینید (Great listening, Sara!) تا بیشتر تکرار شود.");
 tr.forEach(t=>{ (TRAITS[t].behave||[]).forEach(b=>behave.push(`${TRAITS[t].ic} ${b}`)); });
 behave = uniq(behave);

 const psych = [`<b>نیازهای عاطفی این سن:</b> ${esc(d.needs)}`, `<b>رشد اجتماعی:</b> ${esc(d.social)}`,
  ageN<=5 ? "<b>اریکسون (ابتکار در برابر گناه):</b> به ابتکار بچه‌ها میدان بدهید و سؤال‌های پیاپی را نشانه‌ی رشد ببینید. سرزنش زیاد ترس از امتحان کردن می‌سازد." : "<b>اریکسون (سخت‌کوشی در برابر حقارت):</b> کارهای قابل‌انجام بدهید تا موفقیت را تجربه کنند. مقایسه نکنید و تلاش را تحسین کنید."];
 tr.forEach(t=>{ if(TRAITS[t].psych) psych.push(`<b>${TRAITS[t].ic} ${esc(TRAITS[t].fa)}:</b> ${esc(TRAITS[t].psych)}`); });
 return {sci,behave,psych,ageN};
}

function planText(c){
 syncSize(c);
 const R=buildPlan(c), A=analysis(c); let t=0;
 const strip=h=>h.replace(/<[^>]+>/g,"");
 const L=(title,arr)=>arr.length?`\n${title}:\n- ${arr.join("\n- ")}`:"";
 return `طرح درس: ${R.T.fa} | ${(FORMAT_OPTS.find(f=>f[0]===c.format)||["",""])[1]} | ${c.age==="mix"?"سنین مختلط":c.age+" سال"} | ${c.dur} دقیقه\nتاریخ: ${faDate(fromIso(c.date))}${R.occ?"\n🎉 مناسبت: "+R.occ.fa:""}\nلغت‌ها: ${R.words.join(", ")}\n`+
 L("✅ قبل از کلاس",R.prep)+L("🖨️ چاپی",R.M.print)+L("🧸 وسایل",R.M.real)+L("🎨 هنری",R.M.art)+L("🔊 صوتی تصویری",R.M.av)+L("💻 آنلاین",R.M.online)+
 `\n\n🎵 آهنگ‌ها:\n${R.songs.map(k=>`- ${SONGS[k].t}: ${yt(SONGS[k].q)}`).join("\n")}\n🎬 ویدیوها:\n${R.videos.map(v=>`- ${v.t}: ${v.u}`).join("\n")}\n\n📋 اجرا:\n`+
 R.P.map(p=>{const s=t;t+=p.min;return `⏱️ ${s}-${t}: ${p.t}\n${strip(p.what)}${(p.say||[]).length?"\n🗣️ "+p.say.join(" / "):""}${(p.songs||[]).length?"\n🎵 "+p.songs.map(k=>SONGS[k].t).join("، "):""}${p.adapt.length?"\n🔧 "+p.adapt.join(" | "):""}`}).join("\n\n")+
 L("\n🧭 راهکارها",A.behave.slice(0,8))+L("\n🔬 نکات علمی",A.sci.slice(0,6).map(strip))+`\n\n📩 پیام والدین:\n${R.parent}`;
}

/* ---------- view: اخبار روز ---------- */
let NEWS = null, NEWS_ERR = false, newsTopic = "all";
function loadNews(){
 if(NEWS || NEWS_ERR) return;
 fetch("news.json",{cache:"no-store"}).then(r=>{ if(!r.ok) throw 0; return r.json(); }).then(j=>{ NEWS=j; if(location.hash==="#news") route(); }).catch(()=>{ NEWS_ERR=true; if(location.hash==="#news") route(); });
}
function viewNews(){
 loadNews();
 const head = `<h2>🗞️ اخبار و مقاله‌های روز</h2><p class="lead">هر روز صبح به‌طور خودکار تازه‌ترین خبرها و مقاله‌های دنیا درباره‌ی آموزش کودک، گاردنر، رویکردهای آموزشی و نیازهای ویژه اینجا جمع می‌شود.</p>`;
 if(NEWS_ERR) return head + `<div class="warn">اخبار روز در نسخه‌ی نصب‌شده روی گوشی نمایش داده می‌شود (بعد از راه‌اندازی به‌روزرسانی خودکار). در این پیش‌نمایش، فایل اخبار هنوز وجود ندارد.</div>`;
 if(!NEWS) return head + `<div class="out">در حال بارگذاری…</div>`;
 const items = (NEWS.items||[]);
 if(!items.length) return head + `<div class="warn">هنوز اولین به‌روزرسانی انجام نشده. فردا صبح دوباره سر بزنید.</div>`;
 const topics = uniq(items.map(i=>i.topic).filter(Boolean));
 const list = items.filter(i=>newsTopic==="all"||i.topic===newsTopic);
 const tr = u=>"https://translate.google.com/translate?sl=en&tl=fa&u="+encodeURIComponent(u);
 return head + `<p style="font-size:13px;color:var(--muted)">آخرین به‌روزرسانی: ${esc(NEWS.updated_fa||NEWS.updated||"")}</p>
 <div class="chips"><button class="chip ${newsTopic==="all"?"on":""}" data-topic="all">همه</button>${topics.map(t=>`<button class="chip ${newsTopic===t?"on":""}" data-topic="${esc(t)}">${esc(t)}</button>`).join("")}</div>
 ${list.map(i=>`<div class="card"><div class="bi"><div class="enbox"><b>${esc(i.title)}</b>${i.summary?`<div style="font-weight:400;margin-top:6px;font-size:14px">${esc(i.summary)}</div>`:""}</div><div class="fabox">${i.fa_title?`<b>${esc(i.fa_title)}</b>${i.fa_summary?`<div style="margin-top:6px;font-size:14px">${esc(i.fa_summary)}</div>`:""}`:`<span style="color:var(--muted);font-size:14px">برای خواندن ترجمه‌ی فارسی کامل، دکمه‌ی «ترجمه‌ی فارسی» را بزنید.</span>`}</div></div>
 <p style="font-size:13px;color:var(--muted);margin:8px 0 0">${esc(i.source||"")} · ${esc(i.date||"")} ${i.topic?`<span class="pill">${esc(i.topic)}</span>`:""}</p>
 <a class="src" href="${esc(i.link)}" target="_blank" rel="noopener">📖 متن اصلی</a> &nbsp; <a class="src" href="${tr(i.link)}" target="_blank" rel="noopener">🌐 ترجمه‌ی فارسی</a></div>`).join("")}`;
}

const FA_MONTHS = ["فروردین","اردیبهشت","خرداد","تیر","مرداد","شهریور","مهر","آبان","آذر","دی","بهمن","اسفند"];
const H_MONTHS = ["محرم","صفر","ربیع‌الاول","ربیع‌الثانی","جمادی‌الاول","جمادی‌الثانی","رجب","شعبان","رمضان","شوال","ذی‌القعده","ذی‌الحجه"];
const G_MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const FA_WD = ["یکشنبه","دوشنبه","سه‌شنبه","چهارشنبه","پنجشنبه","جمعه","شنبه"];
let PF=null, HF=null;
try{ PF=new Intl.DateTimeFormat("en-u-ca-persian",{year:"numeric",month:"numeric",day:"numeric"}); if(PF.resolvedOptions().calendar!=="persian") PF=null; }catch(e){ PF=null; }
try{ HF=new Intl.DateTimeFormat("en-u-ca-islamic-umalqura",{year:"numeric",month:"numeric",day:"numeric"}); if(!/islamic/.test(HF.resolvedOptions().calendar)) HF=null; }catch(e){ HF=null; }
function parts(f,d){ const o={}; f.formatToParts(d).forEach(p=>{ if(p.type==="year"||p.type==="month"||p.type==="day") o[p.type[0]]=parseInt(p.value.replace(/[^\d]/g,""),10); }); return o; }
const J = d => PF ? parts(PF,d) : null;
const hOff = ()=>{ try{ return +(localStorage.getItem("hoff")||0)||0; }catch(e){ return 0; } };
const H = d => HF ? parts(HF, new Date(d.getTime()+hOff()*86400000)) : null;
const mkDate = (y,m,d)=> new Date(y,m,d,12);
const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const fromIso = s => { const [y,m,d]=(s||"").split("-").map(Number); return y?mkDate(y,m-1,d):mkDate(new Date().getFullYear(),new Date().getMonth(),new Date().getDate()); };
const addDays = (d,n)=> mkDate(d.getFullYear(),d.getMonth(),d.getDate()+n);
const todayD = ()=>{ const t=new Date(); return mkDate(t.getFullYear(),t.getMonth(),t.getDate()); };
function faDate(d){ const j=J(d); const wd=FA_WD[d.getDay()]; return j?`${wd} ${faN(j.d)} ${FA_MONTHS[j.m-1]} ${faN(j.y)}`:wd; }
function gDate(d){ return `${d.getDate()} ${G_MONTHS[d.getMonth()]} ${d.getFullYear()}`; }
function hDate(d){ const h=H(d); return h?`${faN(h.d)} ${H_MONTHS[h.m-1]} ${faN(h.y)}`:""; }

const OCC_BY_ID = Object.fromEntries(OCCASIONS.map(o=>[o.id,o]));

function occasionsOn(d){
 const j=J(d), h=H(d), out=[];
 const keys=[`G:${d.getMonth()+1}-${d.getDate()}`]; if(j) keys.push(`J:${j.m}-${j.d}`); if(h) keys.push(`H:${h.m}-${h.d}`);
 OCCASIONS.forEach(o=>{
  if(o.on && o.on.some(k=>keys.includes(k))) out.push(o);
  if(o.rule==="lastTueEsfand" && j && j.m===12 && d.getDay()===2){ const n=J(addDays(d,7)); if(n && n.m===1) out.push(o); }
  if(o.rule==="firstFriOct" && d.getMonth()===9 && d.getDay()===5 && d.getDate()<=7) out.push(o);
 });
 return out;
}
function upcoming(from,days){ const res=[]; for(let i=0;i<days;i++){ const d=addDays(from,i); occasionsOn(d).forEach(o=>res.push({d,o})); } return res; }
function relDay(d){ const n=Math.round((d-todayD())/86400000); return n===0?"امروز":n===1?"فردا":n===2?"پس‌فردا":n<0?`${faN(-n)} روز پیش`:`${faN(n)} روز دیگر`; }

 ${sOcc.length?sOcc.map(o=>occCard(o,sd)).join(""):`<p style="color:var(--muted)">مناسبت خاصی ثبت نشده.</p>`}

 <h4>🧭 مسیر ارجاع</h4><p>نگرانی ← ۲ تا ۴ هفته مشاهده‌ی ثبت‌شده ← گفتگو با والدین ← معرفی به متخصص (روانشناس کودک، گفتاردرمانگر، کاردرمانگر). همیشه اول بینایی و شنوایی کودک چک شود.</p>
 <h4>💬 گفتگو با والدین (رفتار را بگویید، نه برچسب)</h4><div class="act"><p>«در کلاس دیدم که سارا وقتی صدا بلند می‌شود گوش‌هایش را می‌گیرد. شما در خانه هم چنین چیزی دیده‌اید؟»</p><p>«دیدم که علی در فعالیت‌های نشسته زود بلند می‌شود. با فعالیت‌های حرکتی بهتر همراه می‌شود. نظر شما چیست؟»</p><p class="warn" style="margin:6px 0">هرگز نگویید «فکر می‌کنم بچه‌تان اوتیسم یا ADHD دارد». فقط رفتار را بگویید و در صورت نیاز مشاوره با متخصص را پیشنهاد دهید.</p></div>
 <h4>📝 فرم مشاهده‌ی رفتار (A-B-C)</h4><div class="act"><p><b>تاریخ و موقعیت</b> · <b>قبل از رفتار چه شد؟</b> · <b>خود رفتار</b> (دقیق و بدون تفسیر) · <b>بعد از رفتار چه شد؟</b> · <b>چقدر طول کشید و چند بار؟</b> · <b>چه چیزی کمک کرد؟</b></p></div>
 <h4>✅ چک‌لیست ایمنی فعالیت‌ها</h4><ul class="clean"><li>هیچ وسیله‌ای کوچک‌تر از ۴ سانت برای زیر ۴ سال</li><li>حساسیت غذایی، آسم و لاتکس (بادکنک) را از والدین بپرسید</li><li>بازی آبی و حسی فقط با نظارت دائم</li><li>هیچ بزرگسالی روی بدن کودک فشار نمی‌آورد</li><li>هر بازی لمسی فقط با رضایت کودک</li><li>برای جلسه‌ی فردی، عکس و یادداشت، رضایت کتبی والدین بگیرید</li></ul></div></details>

};

function rr(ctx,x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function wrapLines(ctx,text,maxW){ const words=String(text).split(/\s+/); const lines=[]; let line=""; words.forEach(w=>{ const t=line?line+" "+w:w; if(ctx.measureText(t).width>maxW && line){ lines.push(line); line=w; } else line=t; }); if(line) lines.push(line); return lines; }
function star(ctx,cx,cy,r,color){ ctx.save(); ctx.fillStyle=color; ctx.beginPath(); for(let i=0;i<10;i++){ const a=Math.PI/5*i-Math.PI/2, rad=i%2?r*0.45:r; ctx.lineTo(cx+Math.cos(a)*rad, cy+Math.sin(a)*rad); } ctx.closePath(); ctx.fill(); ctx.restore(); }
function drawPoster(d){
 const sz=AD_SIZES.find(s=>s[0]===d.size)||AD_SIZES[0]; const W=sz[2], H=sz[3]; const P=PAL[d.style]||PAL.fun;

 // decorations only near the edges so they never sit behind text
 const r=rng(7+(d.v||0)*13);
 for(let i=0;i<16;i++){ const side=i%4; let x,y; if(side===0){x=r()*W*0.09;y=H*0.18+r()*H*0.7;} else if(side===1){x=W-r()*W*0.09;y=H*0.18+r()*H*0.7;} else if(side===2){x=W*0.5+r()*W*0.15;y=r()*H*0.06;} else {x=r()*W;y=H*0.92-r()*H*0.04;}
  const s=14+r()*34, c=P.deco[i%P.deco.length]; if(i%2===0) star(ctx,x,y,s*0.7,c); else { ctx.fillStyle=c; ctx.globalAlpha=0.55; ctx.beginPath(); ctx.arc(x,y,s*0.6,0,Math.PI*2); ctx.fill(); ctx.globalAlpha=1; } }
 ctx.textAlign="center"; ctx.textBaseline="middle";
 ctx.font=`900 ${Math.round(W*0.075)}px Nunito, ${PFONT}`;
 [["A",0.12,0.05,P.acc],["B",0.25,0.035,P.acc2],["C",0.38,0.06,"#2fb380"]].forEach(([l,x,y,c],i)=>{ ctx.save(); ctx.translate(W*x,H*y+W*0.03); ctx.rotate((i-1)*0.18); ctx.fillStyle=d.style==="chic"?"#ffffff":c; ctx.fillText(l,0,0); ctx.restore(); });
 const rx=W*0.82, ry=W*0.14, rcol=["#e8505b","#f0a020","#ffd25e","#2fb380","#3d8bfd"]; rcol.forEach((c,i)=>{ ctx.strokeStyle=c; ctx.lineWidth=W*0.016; ctx.beginPath(); ctx.arc(rx,ry,W*0.1-i*W*0.017,Math.PI,0); ctx.stroke(); });
 // contact bar
 const cb=[d.phone?`📞 ${faN(d.phone)}`:"", d.instagram?`📷 ${d.instagram.replace(/^@?/,"@")}`:"", d.telegram?`✈️ ${d.telegram.replace(/^@?/,"@")}`:""].filter(Boolean);
 const barH=W*0.15; ctx.fillStyle=d.style==="chic"?P.acc:P.ink; ctx.fillRect(0,H-barH,W,barH);
 ctx.fillStyle=d.style==="chic"?P.ink:"#ffffff"; ctx.font=`700 ${Math.round(W*0.034)}px ${PFONT}`; ctx.fillText("برای ثبت‌نام و مشاوره پیام دهید",W/2,H-barH+W*0.04);
 ctx.font=`700 ${Math.round(W*(cb.length>2?0.03:0.036))}px ${PFONT}`; ctx.save(); try{ctx.direction="ltr";}catch(e){} ctx.fillText(cb.join("   ")||"شماره‌ی تماس را وارد کنید",W/2,H-barH+W*0.1); ctx.restore();
 // content (auto-fit between top area and bar)
 const top=W*0.26, bottom=H-barH-W*0.04, M=W*0.07, tColor=d.style==="chic"?"#ffffff":P.ink;

 function layout(s, draw){

  ctx.font=`900 ${Math.round(W*0.085*s)}px ${PFONT}`; const tl=wrapLines(ctx,d.title||"کلاس زبان انگلیسی کودک",W-2*M).slice(0,2); tl.forEach(l=>{ if(draw){ ctx.fillStyle=tColor; ctx.textAlign="center"; ctx.fillText(l,W/2,y+W*0.05*s); } y+=W*0.1*s; });
  ctx.font=`700 ${Math.round(W*0.045*s)}px ${PFONT}`; if(draw){ ctx.fillStyle=d.style==="chic"?P.acc:P.acc2; ctx.fillText(`ویژه‌ی کودکان ${d.ages} سال`,W/2,y+W*0.03*s); } y+=W*0.06*s+gap;
  const lh=W*0.066*s, ch=feats.length*lh+W*0.05*s;
  if(feats.length){ if(draw){ ctx.fillStyle=P.card; ctx.globalAlpha=0.96; rr(ctx,M,y,W-2*M,ch,W*0.04); ctx.fill(); ctx.globalAlpha=1; ctx.textAlign="right"; ctx.font=`600 ${Math.round(W*0.04*s)}px ${PFONT}`; let fy=y+W*0.025*s+lh/2; feats.forEach((f,i)=>{ const c=P.deco[i%P.deco.length]; ctx.fillStyle=c==="#ffffff"?P.acc:c; ctx.beginPath(); ctx.arc(W-M-W*0.05,fy,W*0.017*s,0,Math.PI*2); ctx.fill(); ctx.fillStyle=P.ink; ctx.fillText(f,W-M-W*0.09,fy); fy+=lh; }); } y+=ch+gap*1.5; }
  ctx.font=`600 ${Math.round(W*0.038*s)}px ${PFONT}`; ctx.textAlign="center";
  info.forEach(l=>{ wrapLines(ctx,l,W-2*M).forEach(x=>{ if(draw){ ctx.fillStyle=tColor; ctx.fillText(x,W/2,y+W*0.03*s); } y+=W*0.058*s; }); });
  if(teacher){ y+=gap*0.5; ctx.font=`700 ${Math.round(W*0.035*s)}px ${PFONT}`; if(draw){ ctx.fillStyle=tColor; ctx.fillText(teacher,W/2,y+W*0.03*s); } y+=W*0.06*s; }
  return y;
 }
 let s=1.15; while(s>0.55 && layout(s,false)>bottom) s-=0.03;
 const used=layout(s,false)-top, extra=Math.max(0,(bottom-top-used)/2);
 ctx.save(); ctx.translate(0,Math.min(extra,W*0.08)); layout(s,true); ctx.restore();
 cv.remove(); return cv;
}

function drawCard(W,H,lines,styleKey,kicker){
 const P=PAL[styleKey]||PAL.pastel; const cv=document.createElement("canvas"); cv.width=W; cv.height=H; cv.setAttribute("dir","rtl"); cv.style.display="none"; document.body.appendChild(cv);
 const ctx=cv.getContext("2d"); try{ctx.direction="rtl";}catch(e){}
 const g=ctx.createLinearGradient(0,0,W,H); g.addColorStop(0,P.bg[0]); g.addColorStop(1,P.bg[1]); ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
 const r=rng(lines.join("").length+W); for(let i=0;i<12;i++){ const side=i%3; const x=side===0?r()*W*0.1:side===1?W-r()*W*0.1:r()*W; const y=side===2?(r()<0.5?r()*H*0.08:H-r()*H*0.12):r()*H; const c=P.deco[i%P.deco.length]; if(i%2) star(ctx,x,y,12+r()*24,c); else { ctx.globalAlpha=0.5; ctx.fillStyle=c; ctx.beginPath(); ctx.arc(x,y,10+r()*22,0,Math.PI*2); ctx.fill(); ctx.globalAlpha=1; } }
 const tColor=styleKey==="chic"?"#ffffff":P.ink; ctx.textAlign="center"; ctx.textBaseline="middle";
 const M=W*0.1; const card={x:M*0.7,y:H*0.18,w:W-M*1.4,h:H*0.62};
 ctx.fillStyle=P.card; ctx.globalAlpha=0.93; rr(ctx,card.x,card.y,card.w,card.h,W*0.05); ctx.fill(); ctx.globalAlpha=1;
 if(kicker){ ctx.font=`700 ${Math.round(W*0.04)}px ${PFONT}`; const kw=ctx.measureText(kicker).width+W*0.08; ctx.fillStyle=P.acc; rr(ctx,(W-kw)/2,card.y-W*0.04,kw,W*0.08,W*0.04); ctx.fill(); ctx.fillStyle="#fff"; ctx.fillText(kicker,W/2,card.y); }
 const sizes=[0.075,0.06,0.045], weights=[900,800,600];
 function lay(s,draw){ let y=card.y+W*0.1; lines.forEach((t,i)=>{ const k=Math.min(i,2); ctx.font=`${weights[k]} ${Math.round(W*sizes[k]*s)}px ${/^[A-Za-z]/.test(t)?"Nunito, ":""}${PFONT}`; String(t).split("\n").forEach(par=>{ wrapLines(ctx,par,card.w-W*0.1).forEach(l=>{ if(draw){ ctx.fillStyle=i===1?P.acc2:P.ink; if(i===0) ctx.fillStyle=P.ink; const lt=/^[A-Za-z0-9"'(]/.test(l.replace(/^[^A-Za-z\u0600-\u06FF]+/,"")); ctx.save(); try{ ctx.direction=lt?"ltr":"rtl"; }catch(x){} ctx.fillText(l,W/2,y); ctx.restore(); } y+=W*sizes[k]*s*1.5; }); }); y+=W*0.03*s; }); return y; }
 let s=1.3; while(s>0.5 && lay(s,false)>card.y+card.h-W*0.05) s-=0.05;
 const used=lay(s,false)-card.y; ctx.save(); ctx.translate(0,Math.max(0,(card.h-used)/2-W*0.03)); lay(s,true); ctx.restore();
 const h=igHandle(); ctx.font=`700 ${Math.round(W*0.04)}px Nunito, ${PFONT}`; ctx.fillStyle=tColor; ctx.save(); try{ctx.direction="ltr";}catch(e){} ctx.fillText(h||"English for Kids 🌈",W/2,H-H*0.08); ctx.restore();
 ctx.font=`900 ${Math.round(W*0.06)}px Nunito, ${PFONT}`; [["A",0.14,"#e8505b"],["B",0.26,"#3d8bfd"],["C",0.38,"#2fb380"]].forEach(([l,x,c],i)=>{ ctx.save(); ctx.translate(W*x,H*0.08); ctx.rotate((i-1)*0.2); ctx.fillStyle=styleKey==="chic"?"#fff":c; ctx.fillText(l,0,0); ctx.restore(); });
 const out=cv.toDataURL("image/jpeg",0.9); cv.remove(); return out;
}

function mpDraw(img){
 const W=1080, H=MP.fmt==="story"?1920:1350; const cv=document.createElement("canvas"); cv.width=W; cv.height=H; cv.setAttribute("dir","rtl"); cv.style.display="none"; document.body.appendChild(cv);
 const ctx=cv.getContext("2d"); try{ctx.direction="rtl";}catch(e){}
 const st=igSettings().style; const P=PAL[st]||PAL.pastel;
 const pad = MP.frame==="title" ? 50 : 0; const top = MP.frame==="title" ? 190 : 0; const bot = MP.frame==="none" ? 0 : 130;
 if(MP.frame!=="none"){ const g=ctx.createLinearGradient(0,0,W,H); g.addColorStop(0,P.bg[0]); g.addColorStop(1,P.bg[1]); ctx.fillStyle=g; ctx.fillRect(0,0,W,H); }
 const bx=pad, by=pad+top, bw=W-2*pad, bh=H-by-pad-bot;
 const s=Math.max(bw/img.width, bh/img.height); const sw=bw/s, sh=bh/s; const sx=(img.width-sw)/2, sy=(img.height-sh)/2;
 ctx.save(); if(MP.frame==="title"){ rr(ctx,bx,by,bw,bh,40); ctx.clip(); } ctx.drawImage(img,sx,sy,sw,sh,bx,by,bw,bh); ctx.restore();
 ctx.textAlign="center"; ctx.textBaseline="middle";
 if(MP.frame==="title"){ ctx.fillStyle=st==="chic"?"#fff":P.ink; ctx.font=`900 64px ${PFONT}`; const t=MP.title||mpCaptions().story.text; wrapLines(ctx,t,W-120).slice(0,2).forEach((l,i,a)=>ctx.fillText(l,W/2,top/2+pad/2+(i-(a.length-1)/2)*72)); [["A",0.08,"#e8505b"],["B",0.92,"#3d8bfd"]].forEach(([l,x,c])=>{ ctx.font=`900 60px Nunito, ${PFONT}`; ctx.fillStyle=st==="chic"?"#fff":c; ctx.fillText(l,W*x,top/2+pad/2); }); }
 if(MP.frame!=="none"){ ctx.fillStyle=st==="chic"?P.acc:P.ink; ctx.fillRect(0,H-bot,W,bot); ctx.fillStyle=st==="chic"?P.ink:"#fff"; ctx.font=`700 42px Nunito, ${PFONT}`; ctx.save(); try{ctx.direction="ltr";}catch(e){} ctx.fillText((igHandle()||"English for Kids")+"  🌈",W/2,H-bot/2); ctx.restore(); }
 cv.remove(); return cv.toDataURL("image/jpeg",0.92);
}

function withTimeout(p,ms){ return Promise.race([p,new Promise((_,r)=>setTimeout(()=>r(new Error("timeout")),ms))]); }
async function blobToDataURL(b,max=900){ const u=URL.createObjectURL(b); const im=await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=u; }); const s=Math.min(1,max/Math.max(im.width,im.height)); const c=document.createElement("canvas"); c.width=Math.round(im.width*s); c.height=Math.round(im.height*s); c.getContext("2d").drawImage(im,0,0,c.width,c.height); return c.toDataURL("image/jpeg",0.85); }
const AI_SYS = "You are an expert, creative early-childhood English teacher trainer and Persian social-media strategist helping an Iranian preschool English teacher (kids 3-7, play-based, multiple intelligences used to vary activities, not as learning styles). Always write in fluent Persian (Farsi); keep English phrases the teacher says to children in English. Be specific, practical, warm and evidence-based. SAFETY RULES: Never diagnose or suggest a child 'has' a condition; describe behaviours and, when needed, recommend assessment by a child psychologist, speech therapist or occupational therapist. Never advise medication, restraint, isolation, withholding food or physical punishment. For any hint of abuse, self-harm or danger, tell the teacher to calmly document, inform the principal the same day and call Iran's social emergency line 123. Activities must not include adults pressing on a child's body, blindfolds, breath-holding or rapid breathing, objects smaller than 4 cm for under-4s, food or latex without an allergy check, fire or candles, unsupervised water play, or eliciting trauma memories. Never invent statistics, 'research shows' claims without a well-known basis, testimonials or links. Respect Iranian cultural and religious norms.";

async function fetchT(url,opt,ms,ctl){ const t=setTimeout(()=>ctl.abort(),ms); try{ return await fetch(url,{...opt,signal:ctl.signal}); } finally{ clearTimeout(t); } }
function aiRepairJSON(t){ try{ return aiExtractJSON(t); }catch(e){ let s=String(t).replace(/```json|```/g,""); const a=s.indexOf("{"); if(a<0) throw e; s=s.slice(a); let st=[],q=false,esc_=false,out=""; for(const ch of s){ out+=ch; if(esc_){esc_=false;continue;} if(ch==="\\"){esc_=true;continue;} if(ch==='"'){q=!q;continue;} if(q) continue; if(ch==="{"||ch==="[") st.push(ch==="{"?"}":"]"); else if(ch==="}"||ch==="]") st.pop(); } if(q) out+='"'; out=out.replace(/,\s*$/,""); while(st.length) out+=st.pop(); return JSON.parse(out); } }
async function aiAsk(prompt,opts={}){
 const want=opts.json; const temp=opts.temp??0.9; const full = prompt + (want?"\n\nReturn ONLY valid minified JSON, no markdown, no explanations.":"");
 const errs=[]; const K=AIK(); const imgs=opts.images||[]; const deadline=Date.now()+(opts.budget||80000);
 const left=()=>Math.max(5000,deadline-Date.now());
 const parse=t=>want?aiRepairJSON(t):t;
 // 1) Claude (inside Claude only)
 try{ const s=await getSample(); if(s){ const o={modelTier:"default",cache:false}; if(imgs.length){ const lim=s.limits?await s.limits():null; if(lim&&lim.images) o.images=imgs; } const rr=await s(AI_SYS+"\n\n"+full,o); AI_LAST="Claude"; return parse(rr.text); } }catch(e){ errs.push("Claude"); }
 const dataImgs = imgs.length ? await Promise.all(imgs.slice(0,3).map(b=>blobToDataURL(b))) : [];
 // 2) Gemini (free key) — the only external provider allowed to receive photos
 if(K.gemini && Date.now()<deadline){ for(const model of [K.geminiModel||"gemini-flash-latest","gemini-flash-lite-latest"]){ try{
   const parts=[{text:full}, ...dataImgs.map(d=>({inline_data:{mime_type:"image/jpeg",data:d.split(",")[1]}}))];
   const res=await fetchT(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${encodeURIComponent(K.gemini)}`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({systemInstruction:{parts:[{text:AI_SYS}]},contents:[{role:"user",parts}],generationConfig:{temperature:temp,...(want?{responseMimeType:"application/json"}:{})}})},left(),new AbortController());
   if(res.status===429){ errs.push("Gemini: سقف درخواست رایگان پر شده، چند دقیقه صبر کنید"); break; }
   if(res.status===400||res.status===403){ errs.push("Gemini: کلید نامعتبر است یا از این منطقه مجاز نیست"); break; }
   const j=await res.json(); const t=j.candidates&&j.candidates[0]&&j.candidates[0].content.parts.map(x=>x.text||"").join(""); if(!t) throw new Error("empty"); AI_LAST="Gemini"; return parse(t); }catch(e){ errs.push("Gemini"); } } }
 if(imgs.length && !opts.allowThirdPartyImages){ throw new Error("برای حفظ حریم خصوصی، عکس فقط برای Gemini (با کلید خودتان) یا Claude فرستاده می‌شود. "+(K.gemini?"Gemini پاسخ نداد؛ دوباره امتحان کنید.":"در «تنظیمات هوش مصنوعی» کلید رایگان Gemini را وارد کنید.")); }
 const oaMsgs=[{role:"system",content:AI_SYS},{role:"user",content:full}];
 const oaBody=(model,extra={})=>JSON.stringify({model,messages:oaMsgs,temperature:temp,...(want?{response_format:{type:"json_object"}}:{}),...extra});
 // 3) OpenRouter (free models)
 if(K.openrouter && Date.now()<deadline){ try{ const res=await fetchT("https://openrouter.ai/api/v1/chat/completions",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+K.openrouter},body:oaBody(K.orModel||"openrouter/free")},left(),new AbortController()); if(res.status===429) throw new Error("429"); const j=await res.json(); const t=j.choices&&j.choices[0].message.content; if(!t) throw new Error("empty"); AI_LAST="OpenRouter"; return parse(t); }catch(e){ errs.push(String(e.message)==="429"?"OpenRouter: سقف روزانه پر شده":"OpenRouter"); } }
 // 4) Pollinations (free, no key needed)
 const pollTries = K.pollinations ? [["https://gen.pollinations.ai/v1/chat/completions",{"Authorization":"Bearer "+K.pollinations}]] : [];
 pollTries.push(["https://text.pollinations.ai/openai",{}]);
 for(const [url,h] of pollTries){ if(Date.now()>=deadline) break; try{ const res=await fetchT(url,{method:"POST",headers:{"Content-Type":"application/json",...h},body:oaBody("openai",{seed:Math.floor(Math.random()*1e6)})},left(),new AbortController()); if(res.status===429){ errs.push("Pollinations: لطفاً ۱۵ ثانیه صبر کنید و دوباره بزنید"); continue; } const ct=res.headers.get("content-type")||""; let t; if(ct.includes("json")){ const j=await res.json(); t=j.choices?j.choices[0].message.content:(j.content||JSON.stringify(j)); } else t=await res.text(); if(!t||!res.ok) throw new Error("poll "+res.status); AI_LAST="Pollinations"; return parse(t); }catch(e){ if(!errs.some(x=>x.startsWith("Pollinations"))) errs.push("Pollinations"); } }
 throw new Error("هوش مصنوعی پاسخ نداد: "+errs.join(" · ")+". اتصال اینترنت یا فیلترشکن را چک کنید و دوباره امتحان کنید.");
}

 const dt = e.target.closest("[data-date]"); if(dt){ const c=cur(); c.date=dt.dataset.date; c.occ=""; save(); rerender(true); return; }
 const oc = e.target.closest("[data-occ]"); if(oc){ const c=cur(); c.occ = c.occ===oc.dataset.occ ? "" : oc.dataset.occ; if(c.occ && OCC_BY_ID[c.occ] && THEMES[OCC_BY_ID[c.occ].theme] && c.theme!==OCC_BY_ID[c.occ].theme){ c.theme=OCC_BY_ID[c.occ].theme; save(); rerender(true); return; } oc.parentElement.querySelectorAll("[data-occ]").forEach(x=>x.classList.toggle("on", x.dataset.occ===c.occ)); save(); refreshPlan(); return; }
 const cd = e.target.closest("[data-calday]"); if(cd){ calSel=cd.dataset.calday; rerender(true); return; }
 const pf = e.target.closest("[data-planfor]"); if(pf){ const c=cur(); c.date=pf.dataset.planfor; c.occ=pf.dataset.planocc||""; if(c.occ && OCC_BY_ID[c.occ] && THEMES[OCC_BY_ID[c.occ].theme]) c.theme=OCC_BY_ID[c.occ].theme; showPlan=true; save(); if(location.hash==="#class") rerender(); else location.hash="#class"; setTimeout(()=>{const o=document.getElementById("planOut"); if(o) o.scrollIntoView({behavior:"smooth",block:"start"});},250); return; }
 const id = e.target.id;
 if(id==="calPrev"||id==="calNext"){ let [y,m]=calYM; m+= id==="calNext"?1:-1; if(m>12){m=1;y++;} if(m<1){m=12;y--;} calYM=[y,m]; rerender(true); return; }
 if(id==="kidAdd"){ cur().kids.push({name:"",traits:[]}); save(); rerender(true); return; }
 if(id==="clsNew"){ ST.classes.push(Object.assign(newClass(),{name:"کلاس "+(ST.classes.length+1)})); ST.active=ST.classes.length-1; showPlan=false; save(); rerender(); return; }
 if(id==="clsDel"){ if(e.target.dataset.arm!=="1"){ e.target.dataset.arm="1"; const o=e.target.textContent; e.target.textContent="⚠️ برای حذف دوباره بزنید"; setTimeout(()=>{ e.target.dataset.arm=""; e.target.textContent=o; },3000); return; } ST.classes.splice(ST.active,1); ST.active=0; showPlan=false; save(); rerender(); return; }
 if(id==="planBtn"){ showPlan=true; refreshPlan(); setTimeout(()=>{const o=document.getElementById("planOut"); if(o) o.scrollIntoView({behavior:"smooth",block:"start"});},60); return; }
 if(id==="planAgain"){ cur().seed=(cur().seed||1)+1; save(); refreshPlan(); const o=document.getElementById("planOut"); if(o) o.scrollIntoView({behavior:"smooth",block:"start"}); return; }
 if(id==="copyParent"){ try{ await navigator.clipboard.writeText(document.getElementById("parentMsg").textContent); e.target.textContent="کپی شد ✓"; }catch(err){ e.target.textContent="کپی نشد"; } return; }
 if(e.target.dataset && e.target.dataset.pdrub){ const [i,n]=e.target.dataset.pdrub.split("_").map(Number); const s=pdState(); s.rub=s.rub||{}; s.rub[s.week]=s.rub[s.week]||{}; s.rub[s.week][i]=n; pdSave(s); e.target.parentNode.querySelectorAll(".chip").forEach(b=>b.classList.toggle("on",b===e.target)); return; }
 if(id==="pdExport"){ const s=pdState(); const L=["🎓 پورتفولیوی رشد حرفه‌ای من",""]; PD_WEEKS.forEach((w,i)=>{ const f=(s.port||{})[i]||{}; const rb=(s.rub||{})[i]; if(!f.pre&&!f.output&&!f.evidence&&!f.post&&!rb) return; L.push(`— هفته‌ی ${i+1}: ${w.t}`); [["pre","قبل"],["output","خروجی"],["evidence","شاهد"],["post","بعد"]].forEach(([k,l])=>{ if(f[k]) L.push(`${l}: ${f[k]}`); }); if(rb) L.push(`چک‌لیست I can: ${Object.values(rb).reduce((a,b)=>a+b,0)} از 24`); L.push(""); }); if(s.journal) L.push("📝 دفتر بازتاب:\n"+s.journal); const txt=L.join("\n"); try{ await navigator.clipboard.writeText(txt); e.target.textContent="کپی شد ✓"; }catch(err){ try{ await navigator.share({text:txt}); }catch(x){ e.target.textContent="کپی نشد"; } } return; }
 if(e.target.dataset && e.target.dataset.hoff!==undefined){ try{ localStorage.setItem("hoff",e.target.dataset.hoff); }catch(x){} rerender(true); return; }
 if(id==="bkExport"){ const o={app:"miz-moalem",v:1,date:new Date().toISOString(),data:{}}; try{ for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); if(k==="aikeys") continue; o.data[k]=localStorage.getItem(k); } }catch(x){} try{ navigator.storage&&navigator.storage.persist&&navigator.storage.persist(); }catch(x){} const txt=JSON.stringify(o); const name=`miz-moalem-backup-${iso(todayD())}.json`; const out=document.getElementById("bkOut"); try{ const f=new File([txt],name,{type:"application/json"}); if(navigator.canShare&&navigator.canShare({files:[f]})){ await navigator.share({files:[f],title:name}); out.innerHTML=`<p class="ok">پشتیبان آماده شد ✓</p>`; return; } }catch(x){ if(x&&x.name==="AbortError") return; } try{ const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([txt],{type:"application/json"})); a.download=name; document.body.appendChild(a); a.click(); a.remove(); out.innerHTML=`<p class="ok">فایل پشتیبان دانلود شد ✓</p>`; }catch(x){ out.innerHTML=`<p>این متن را کپی و جایی ذخیره کنید:</p><textarea style="min-height:100px">${esc(txt)}</textarea>`; } return; }
 if(id==="bkImportBtn"){ document.getElementById("bkFile").click(); return; }
 if(id==="pdPrev"||id==="pdNext"){ const s=pdState(); s.week=Math.max(0,Math.min(11,s.week+(id==="pdNext"?1:-1))); pdSave(s); rerender(); return; }
 if(id==="planCopy"){ try{ await navigator.clipboard.writeText(planText(cur())); e.target.textContent="کپی شد ✓"; }catch(err){ e.target.textContent="کپی نشد"; } return; }
 if(id==="planAI"){ const s=await getSample(); const out=document.getElementById("planAIOut"); if(!s||!out) return; out.style.display="block"; out.textContent="در حال فکر کردن…"; e.target.disabled=true;
  const c=cur(); const prof = `نوع کلاس: ${c.format}، سن: ${c.age}، تعداد: ${c.count}، مدت: ${c.dur} دقیقه، سطح: ${c.level}، فضا: ${c.space}، رویکرد: ${c.approach}، موضوع: ${THEMES[c.theme].fa}، هوش‌ها: ${(c.intel||[]).map(k=>INTEL_SHORT[k]).join("، ")||"همه"}، ویژگی‌های کلاس: ${allTraits(c).map(t=>TRAITS[t].fa).join("، ")||"ندارد"}، بچه‌ها: ${(c.kids||[]).map(k=>`${k.name||"کودک"} (${(k.traits||[]).map(t=>TRAITS[t]?TRAITS[t].fa:t).join("، ")})`).join("؛ ")||"-"}`;
  try{ const r=await s(`You are an expert early-childhood English teacher trainer and child psychologist. Write ONLY in Persian, with English teacher phrases in English. Class profile: ${prof}\nDraft plan:\n${planText(c)}\n\nImprove this into a richer, practical lesson plan for an Iranian preschool classroom, with evidence-based behavioral and psychological guidance for this class and for each named child, exact English phrases, and differentiation. Short headings and bullets, plain text.`,{modelTier:"default",cache:false,onText:({text})=>{out.textContent=text}}); out.textContent=r.text; }
  catch(err){ out.textContent="انجام نشد. کمی بعد دوباره امتحان کنید."; }
  e.target.disabled=false; return; }
});
document.addEventListener("change", e=>{
 if(e.target.id==="bkFile"){ const f=e.target.files&&e.target.files[0]; if(!f) return; const out=document.getElementById("bkOut"); f.text().then(t=>{ const o=JSON.parse(t); if(!o||o.app!=="miz-moalem"||!o.data) throw 0; Object.entries(o.data).forEach(([k,v])=>{ if(k!=="aikeys") localStorage.setItem(k,v); }); out.innerHTML=`<p class="ok">اطلاعات بازگردانده شد ✓ اپ دوباره بارگذاری می‌شود…</p>`; setTimeout(()=>location.reload(),1200); }).catch(()=>{ out.innerHTML=`<p class="warn">این فایل پشتیبانِ همین اپ نیست.</p>`; }); return; }
 if(e.target.id==="mpFile"){ MP.files=[...(e.target.files||[])]; MP.out=false; rerender(true); return; }
 if(e.target.dataset && e.target.dataset.igdone){ let dn={}; try{ dn=JSON.parse(localStorage.getItem("igdone")||"{}"); }catch(x){} dn[e.target.dataset.igdone]=e.target.checked; try{ localStorage.setItem("igdone",JSON.stringify(dn)); }catch(x){} return; }
 if(e.target.id==="igHandle"){ const s=igSettings(); s.handle=e.target.value; igSetSave(s); igRenderImages(); return; }
 if(e.target.dataset && e.target.dataset.adi!==undefined){ const d=adGet(); d[e.target.dataset.adi]=e.target.value; adSet(d); return; }
 if(e.target.id==="clsDate"){ const c=cur(); if(e.target.value){ c.date=e.target.value; c.occ=""; save(); rerender(true); } return; }
 const d=e.target.dataset||{};
 if(d.chk){ let st={}; try{ st=JSON.parse(localStorage.getItem("chk_"+d.chk)||"{}"); }catch(x){} st[d.i]=e.target.checked; try{ localStorage.setItem("chk_"+d.chk,JSON.stringify(st)); }catch(x){} return; }
 if(d.pdday!==undefined){ const s=pdState(); const k=todayKey(); s.days[k]=s.days[k]||{}; s.days[k][d.pdday]=e.target.checked; pdSave(s); return; }
 if(d.pdweek!==undefined){ const s=pdState(); s.done[d.pdweek]=e.target.checked; if(e.target.checked && s.week<11){ s.week++; } pdSave(s); rerender(); return; }
 if(e.target.id==="clsSel"){ ST.active=+e.target.value; showPlan=false; save(); rerender(); }
});

 if(e.target.dataset && e.target.dataset.aik){ const k=AIK(); k[e.target.dataset.aik]=e.target.value.trim(); AIKsave(k); return; }
 if(e.target.id==="mpNote"){ MP.note=e.target.value; return; }
 if(e.target.id==="mpTitle"){ MP.title=e.target.value; return; }
 if(e.target.dataset && e.target.dataset.adi!==undefined){ const d=adGet(); d[e.target.dataset.adi]=e.target.value; adSet(d); return; }
 if(e.target.id==="pdJournal"){ const s=pdState(); s.journal=e.target.value; pdSave(s); return; }
 if(e.target.dataset && e.target.dataset.pdport){ const s=pdState(); s.port=s.port||{}; s.port[s.week]=s.port[s.week]||{}; s.port[s.week][e.target.dataset.pdport]=e.target.value; pdSave(s); return; }
 if(e.target.dataset && e.target.dataset.note!==undefined){ cur().notes=e.target.value; save(); return; }
 if(e.target.id==="clsName"){ cur().name=e.target.value; save(); const o=document.querySelector(`#clsSel option[value="${ST.active}"]`); if(o) o.textContent=e.target.value; }
 if(e.target.dataset && e.target.dataset.kidname!==undefined){ cur().kids[+e.target.dataset.kidname].name=e.target.value; save(); }
});

new MutationObserver(async()=>{ const b=document.getElementById("planAI"); if(b && b.style.display==="none"){ const s=await getSample(); if(s) b.style.display="inline-block"; } }).observe(document.getElementById("app"),{childList:true,subtree:true});
route();
