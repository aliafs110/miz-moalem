<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="میز معلم">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffd9c7">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<title>میز کار معلم زبان کودک</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fffaf3; --card:#ffffff; --ink:#2b2a33; --muted:#6b6878; --line:#efe7da;
  --brand:#e86a4f; --brand2:#3d8bfd; --soft:#fff1e8;
  --r:18px;
}
*{box-sizing:border-box}

body{margin:0;background:var(--bg);color:var(--ink);font-family:Vazirmatn,system-ui,sans-serif;line-height:1.85;font-size:16px}
.en{font-family:Nunito,system-ui,sans-serif;direction:ltr;unicode-bidi:isolate;font-weight:700;color:#3a5fb0}
header.top{background:linear-gradient(135deg,#ffd9c7,#ffe9b8 55%,#d6ecff);padding:calc(22px + env(safe-area-inset-top)) calc(18px + env(safe-area-inset-right)) 18px calc(18px + env(safe-area-inset-left))}
header.top h1{margin:0;font-size:24px;font-weight:800}
header.top p{margin:4px 0 0;color:#5b4f47;font-size:14px}
nav{position:sticky;top:0;z-index:10;background:rgba(255,250,243,.96);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
nav .bar{display:flex;gap:6px;overflow-x:auto;padding:10px 12px;scrollbar-width:none}
nav .bar::-webkit-scrollbar{display:none}
nav a{flex:0 0 auto;text-decoration:none;color:var(--ink);background:#fff;border:1px solid var(--line);padding:7px 13px;border-radius:999px;font-size:14px;font-weight:500;white-space:nowrap}
nav a.on{background:var(--brand);color:#fff;border-color:var(--brand)}
main{max-width:980px;margin:0 auto;padding:18px calc(14px + env(safe-area-inset-right)) calc(80px + env(safe-area-inset-bottom)) calc(14px + env(safe-area-inset-left))}
section.view{display:none}
section.view.on{display:block;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1}}
h2{font-size:22px;margin:6px 0 6px;font-weight:800}
h3{font-size:18px;margin:18px 0 8px;font-weight:700}
h4{font-size:16px;margin:14px 0 6px;font-weight:700}
p.lead{color:var(--muted);margin-top:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;text-decoration:none;color:inherit;display:block;transition:transform .15s}
.tile:hover{transform:translateY(-2px)}
.tile .ic{font-size:28px}
.tile b{display:block;font-size:16px;margin-top:4px}
.tile span{font-size:13px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;cursor:pointer;font:inherit;font-size:14px}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin:12px 0}
.card.tint{border-right:6px solid var(--c,#e86a4f)}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin:10px 0}
.fact{background:var(--soft);border-radius:14px;padding:10px 12px;font-size:14px}
.fact b{display:block;font-size:13px;color:var(--brand)}
.act{border-top:1px dashed var(--line);padding:12px 0}
.act:first-of-type{border-top:0}
.act .t{font-weight:700}
.act .phr{display:inline-block;background:#eef4ff;border-radius:8px;padding:1px 8px;margin:4px 0;font-size:14px}
.act p{margin:4px 0;font-size:15px}
ul.clean{padding-right:20px;margin:6px 0}
ul.clean li{margin:3px 0}
.warn{background:#fff6e0;border:1px solid #f3dc9c;border-radius:14px;padding:12px 14px;font-size:14px}
.ok{background:#eaf8ef;border:1px solid #bfe6cc;border-radius:14px;padding:12px 14px;font-size:14px}
.avoid li::marker{content:"✕  ";color:#c9483a}
.do li::marker{content:"✓  ";color:#2f9e5a}
table{width:100%;border-collapse:collapse;font-size:14px;background:#fff;border-radius:14px;overflow:hidden}
th,td{border-bottom:1px solid var(--line);padding:9px 10px;text-align:right;vertical-align:top}
th{background:#fbf3e8}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px}
.stars{color:#f0a020;letter-spacing:2px;white-space:nowrap}
.bi{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.bi .enbox{direction:ltr;text-align:left;font-family:Nunito,system-ui,sans-serif;font-weight:600;font-size:15px;background:#f4f8ff;border-radius:12px;padding:10px 12px;line-height:1.6}
.bi .fabox{background:#fff7f0;border-radius:12px;padding:10px 12px;font-size:15px}
@media (max-width:640px){.bi{grid-template-columns:1fr}}
a.src{color:var(--brand2);font-weight:600}
label{font-size:14px;font-weight:600;display:block;margin:10px 0 4px}
select,textarea,input[type=text]{width:100%;font:inherit;border:1px solid #e2d8c8;border-radius:12px;padding:9px 11px;background:#fff}
textarea{min-height:130px;resize:vertical}
.ltr{direction:ltr;text-align:left}
button.go{font:inherit;font-weight:700;background:var(--brand);color:#fff;border:0;border-radius:12px;padding:11px 20px;cursor:pointer;margin-top:12px}
button.go:disabled{opacity:.55}
button.ghost{font:inherit;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 14px;cursor:pointer;margin:12px 6px 0 0}
.out{white-space:pre-wrap;background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:12px;min-height:40px;font-size:15px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:640px){.two{grid-template-columns:1fr}}
details{background:#fff;border:1px solid var(--line);border-radius:var(--r);margin:10px 0;padding:0 16px}
details summary{cursor:pointer;padding:14px 0;font-weight:700;font-size:17px;list-style:none}
details summary::-webkit-details-marker{display:none}
details summary::after{content:"＋";float:left;color:var(--muted)}
details[open] summary::after{content:"－"}
details>div{padding-bottom:14px}
.pill{display:inline-block;font-size:12px;border-radius:999px;padding:1px 9px;background:#f1ece4;color:#5b524a;margin-left:4px}
.out,.act,.card,a.src,.fabox,.enbox{overflow-wrap:anywhere;word-break:break-word}
main{overflow-x:clip}
footer{color:var(--muted);font-size:13px;text-align:center;padding:20px}
</style>
</head>
<body>
<header class="top">
  <h1>🌈 میز کار معلم زبان کودک</h1>
  <p>آموزش انگلیسی به کودکان ۳ تا ۷ سال · هوش‌های چندگانه · نیازهای ویژه · رویکردهای آموزشی</p>
</header>
<nav><div class="bar" id="navbar"></div></nav>
<main id="app"></main>
<footer>این سایت نسخه‌ی اول است و هر بخش قابل گسترش است. 🌱</footer>

 {k:"montessori", ic:"🧺", fa:"مونته‌سوری", en:"Montessori", by:"ماریا مونته‌سوری، پزشک ایتالیایی", iran:3, c:"#c58a3a",

 {k:"highscope", ic:"🔁", fa:"های‌اسکوپ", en:"HighScope", by:"دیوید وایکارت و همکاران، آمریکا", iran:4, c:"#3d8bfd",

const RENDER = {home:viewHome,ages:viewAges,gardner:viewGardner,needs:viewNeeds,approaches:viewApproaches,finland:viewFinland,articles:viewArticles,assistant:viewAssistant};

function route(){
 let h=(location.hash||"#home").slice(1);
 let anchor=null;
 if(h.startsWith("g-")){anchor=h;h="gardner"}
 else if(h.startsWith("n-")){anchor=h;h="needs"}
 else if(h.startsWith("a-")){anchor=h;h="approaches"}
 if(!RENDER[h]) h="home";
 document.querySelectorAll("nav a").forEach(a=>a.classList.toggle("on",a.dataset.k===h));
 const on=document.querySelector("nav a.on"); if(on) on.scrollIntoView({inline:"center",block:"nearest"});
 $("#app").innerHTML=`<section class="view on">${RENDER[h]()}</section>`;
 if(h==="assistant") wireAssistant();
 if(anchor){const el=document.getElementById(anchor); if(el){el.open=true; setTimeout(()=>el.scrollIntoView({behavior:"smooth",block:"start"}),50);} }
 else window.scrollTo(0,0);
}
document.addEventListener("click",e=>{
 const dv=e.target.closest("[data-dev]");
 if(dv){document.querySelectorAll("[data-dev]").forEach(x=>x.classList.toggle("on",x===dv)); document.getElementById("devBox").innerHTML=devCard(+dv.dataset.dev); return;}
 const b=e.target.closest("[data-age]");
 if(b){store("age",b.dataset.age); route();}
});
window.addEventListener("hashchange",route);
route();

/* ============================ AI (sample capability) ============================ */
let samplePromise = (window.claude && window.claude.use) ? window.claude.use("sample") : Promise.resolve(null);
async function getSample(){ try{ return await samplePromise; }catch(e){ return null; } }

async function wireAssistant(){
 const sample = await getSample();
 if(!sample){ const n=$("#noAI"); if(n) n.style.display="block"; ["#genBtn","#trBtn"].forEach(s=>{const x=$(s); if(x) x.disabled=true}); return; }
 const genBtn=$("#genBtn"); if(!genBtn) return;
 genBtn.onclick=async()=>{
  const out=$("#genOut"); out.style.display="block"; out.textContent="در حال فکر کردن…"; genBtn.disabled=true;
  const p=`You are an expert early-childhood English teacher trainer. Write ONLY in Persian (Farsi), but put every English phrase the teacher will say to children in English.
Create: ${$("#sType").value}
Children's age: ${$("#sAge").value}
Topic / vocabulary: ${$("#sTopic").value||"به انتخاب خودت، یک موضوع مناسب"}
Gardner intelligence focus: ${$("#sInt").value}
Teaching approach: ${$("#sApp").value}
Special need present in class: ${$("#sNeed").value}
Requirements: play-based, practical for an Iranian preschool classroom with limited budget, give timings, materials list, exact English teacher phrases, and if a special need is present include specific adaptations for that child. Use short headings and bullet points. Plain text, no markdown tables.`;
  try{
   const r=await sample(p,{modelTier:"default",cache:false,onText:({text})=>{out.textContent=text}});
   out.textContent=r.text; $("#copyGen").style.display="inline-block";
  }catch(err){ out.textContent = err && err.code==="rate_limited" ? "کمی صبر کنید و دوباره امتحان کنید." : "متأسفانه ساخته نشد. دوباره امتحان کنید."; }
  genBtn.disabled=false;
 };
 $("#copyGen").onclick=async()=>{try{await navigator.clipboard.writeText($("#genOut").textContent); $("#copyGen").textContent="کپی شد ✓"}catch(e){$("#copyGen").textContent="کپی نشد"}};
 const trBtn=$("#trBtn");
 trBtn.onclick=async()=>{
  const txt=$("#trIn").value.trim(); const out=$("#trOut");
  if(!txt){out.innerHTML=`<p class="warn">اول متن انگلیسی را بچسبانید.</p>`;return;}
  trBtn.disabled=true; out.innerHTML=`<div class="out">در حال ترجمه…</div>`;
  const p=`Translate the following English text into fluent, natural Persian (Farsi) for an Iranian preschool English teacher. Split the text into paragraphs. Return ONLY JSON of the form {"pairs":[{"en":"original paragraph","fa":"Persian translation"}]${$("#trSum").checked?',"summary":"a 3-4 sentence Persian summary","classroom":"2-4 practical Persian tips for applying this in a 3-7 year-old English class"':''}}.
TEXT:
${txt.slice(0,12000)}`;
  try{
   const j=await sample.json(p,{modelTier:"default"});
   let html=(j.pairs||[]).map(x=>`<div class="bi" style="margin-top:10px"><div class="enbox">${esc(x.en)}</div><div class="fabox">${esc(x.fa)}</div></div>`).join("");
   if(j.summary) html=`<div class="ok" style="margin-top:12px"><b>خلاصه:</b> ${esc(j.summary)}</div>`+html;
   if(j.classroom) html+=`<div class="card" style="margin-top:12px"><b>👉 کاربرد در کلاس:</b><div style="white-space:pre-wrap">${esc(Array.isArray(j.classroom)?j.classroom.join("\n"):j.classroom)}</div></div>`;
   out.innerHTML=html||`<p class="warn">ترجمه خالی بود. دوباره امتحان کنید.</p>`;
  }catch(err){ out.innerHTML=`<p class="warn">${err && err.code==="rate_limited"?"کمی صبر کنید و دوباره امتحان کنید.":"ترجمه انجام نشد. دوباره امتحان کنید."}</p>`; }
  trBtn.disabled=false;
 };
}

function chips(field, options, multi, val){
 return `<div class="chips">${options.map(([v,l])=>{
   const on = multi ? (val||[]).includes(v) : String(val)===String(v);
   return `<button class="chip ${on?"on":""}" data-f="${field}" data-v="${esc(v)}" ${multi?'data-m="1"':''}>${l}</button>`;
 }).join("")}</div>`;
}
function rng(seed){ let a = seed>>>0; return ()=>{ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
const uniq = a=>[...new Set(a)];
function songLink(k){ const s=SONGS[k]; if(!s) return ""; return `<a class="src" href="${yt(s.q)}" target="_blank" rel="noopener">🎵 ${esc(s.t)}</a>`; }

function planText(c){
 syncSize(c);
 const R=buildPlan(c), A=analysis(c); let t=0;
 const strip=h=>h.replace(/<[^>]+>/g,"");
 const L=(title,arr)=>arr.length?`\n${title}:\n- ${arr.join("\n- ")}`:"";
 return `طرح درس: ${R.T.fa} | ${(FORMAT_OPTS.find(f=>f[0]===c.format)||["",""])[1]} | ${c.age==="mix"?"سنین مختلط":c.age+" سال"} | ${c.dur} دقیقه\nلغت‌ها: ${R.words.join(", ")}\n`+
 L("✅ قبل از کلاس",R.prep)+L("🖨️ چاپی",R.M.print)+L("🧸 وسایل",R.M.real)+L("🎨 هنری",R.M.art)+L("🔊 صوتی تصویری",R.M.av)+L("💻 آنلاین",R.M.online)+
 `\n\n🎵 آهنگ‌ها:\n${R.songs.map(k=>`- ${SONGS[k].t}: ${yt(SONGS[k].q)}`).join("\n")}\n🎬 ویدیوها:\n${R.videos.map(v=>`- ${v.t}: ${v.u}`).join("\n")}\n\n📋 اجرا:\n`+
 R.P.map(p=>{const s=t;t+=p.min;return `⏱️ ${s}-${t}: ${p.t}\n${strip(p.what)}${(p.say||[]).length?"\n🗣️ "+p.say.join(" / "):""}${(p.songs||[]).length?"\n🎵 "+p.songs.map(k=>SONGS[k].t).join("، "):""}${p.adapt.length?"\n🔧 "+p.adapt.join(" | "):""}`}).join("\n\n")+
 L("\n🧭 راهکارها",A.behave.slice(0,8))+L("\n🔬 نکات علمی",A.sci.slice(0,6).map(strip))+`\n\n📩 پیام والدین:\n${R.parent}`;
}

 const byTheme = Object.entries(THEMES).map(([k,t])=>`<div class="act"><div class="t">${t.ic} ${esc(t.fa)}</div><p>${t.songs.map(songLink).join(" · ")}</p></div>`).join("");
 return `<h2>🎵 آهنگ‌ها</h2><p class="lead">آهنگ‌های کلاسیک و پرکاربرد کلاس زبان کودک. روی هر کدام بزنید تا نسخه‌های آن در یوتیوب باز شود.</p>
 <div class="warn">برای استفاده‌ی بدون اینترنت در کلاس، آهنگ‌ها را از راه‌های قانونی ذخیره کنید، مثل امکان دانلود داخل اپ یوتیوب یا اپ‌های رسمی کانال‌های آهنگ کودک. یوتیوب در ایران فیلتر است و برای باز شدن لینک‌ها ممکن است فیلترشکن لازم باشد.</div>
 <div class="card"><h3 style="margin-top:0">⭐ روتین هر جلسه</h3>${["hello","cleanup","goodbye"].map(k=>`<div class="act">${songLink(k)} <span style="font-size:13px;color:var(--muted)">${esc(SONGS[k].use)}</span></div>`).join("")}</div>
 <div class="card"><h3 style="margin-top:0">📚 همه‌ی آهنگ‌ها</h3><div class="tablewrap"><table><tr><th>آهنگ</th><th>کاربرد</th><th>سن</th></tr>${Object.keys(SONGS).map(k=>`<tr><td>${songLink(k)}</td><td>${esc(SONGS[k].use)}</td><td>${SONGS[k].age}</td></tr>`).join("")}</table></div></div>
 <div class="card"><h3 style="margin-top:0">🗂️ بر اساس موضوع درس</h3>${byTheme}</div>
 <div class="card"><h3 style="margin-top:0">💡 نکته‌های استفاده از آهنگ</h3><ul class="clean do"><li>هر آهنگ را چند جلسه پشت سر هم تکرار کنید. بچه‌ها با تکرار حفظ می‌کنند.</li><li>همیشه با حرکت بخوانید (هوش بدنی و موسیقیایی با هم).</li><li>اول آهسته بخوانید، بعد تند کنید تا هیجان بیشتر شود.</li><li>آهنگ‌های ثابت سلام و خداحافظی به بچه‌های اوتیسم و مضطرب امنیت می‌دهد.</li><li>برای بچه‌های حساس به صدا، صدای پخش را کم نگه دارید.</li></ul></div>`;
}

/* ---------- view: اخبار روز ---------- */
let NEWS = null, NEWS_ERR = false, newsTopic = "all";
function loadNews(){
 if(NEWS || NEWS_ERR) return;
 fetch("news.json",{cache:"no-store"}).then(r=>{ if(!r.ok) throw 0; return r.json(); }).then(j=>{ NEWS=j; if(location.hash==="#news") route(); }).catch(()=>{ NEWS_ERR=true; if(location.hash==="#news") route(); });
}
function viewNews(){
 loadNews();
 const head = `<h2>🗞️ اخبار و مقاله‌های روز</h2><p class="lead">هر روز صبح به‌طور خودکار تازه‌ترین خبرها و مقاله‌های دنیا درباره‌ی آموزش کودک، گاردنر، رویکردهای آموزشی و نیازهای ویژه اینجا جمع می‌شود.</p>`;
 if(NEWS_ERR) return head + `<div class="warn">اخبار روز در نسخه‌ی نصب‌شده روی گوشی نمایش داده می‌شود (بعد از راه‌اندازی به‌روزرسانی خودکار). در این پیش‌نمایش، فایل اخبار هنوز وجود ندارد.</div>`;
 if(!NEWS) return head + `<div class="out">در حال بارگذاری…</div>`;
 const items = (NEWS.items||[]);
 if(!items.length) return head + `<div class="warn">هنوز اولین به‌روزرسانی انجام نشده. فردا صبح دوباره سر بزنید.</div>`;
 const topics = uniq(items.map(i=>i.topic).filter(Boolean));
 const list = items.filter(i=>newsTopic==="all"||i.topic===newsTopic);
 const tr = u=>"https://translate.google.com/translate?sl=en&tl=fa&u="+encodeURIComponent(u);
 return head + `<p style="font-size:13px;color:var(--muted)">آخرین به‌روزرسانی: ${esc(NEWS.updated_fa||NEWS.updated||"")}</p>
 <div class="chips"><button class="chip ${newsTopic==="all"?"on":""}" data-topic="all">همه</button>${topics.map(t=>`<button class="chip ${newsTopic===t?"on":""}" data-topic="${esc(t)}">${esc(t)}</button>`).join("")}</div>
 ${list.map(i=>`<div class="card"><div class="bi"><div class="enbox"><b>${esc(i.title)}</b>${i.summary?`<div style="font-weight:400;margin-top:6px;font-size:14px">${esc(i.summary)}</div>`:""}</div><div class="fabox">${i.fa_title?`<b>${esc(i.fa_title)}</b>${i.fa_summary?`<div style="margin-top:6px;font-size:14px">${esc(i.fa_summary)}</div>`:""}`:`<span style="color:var(--muted);font-size:14px">برای خواندن ترجمه‌ی فارسی کامل، دکمه‌ی «ترجمه‌ی فارسی» را بزنید.</span>`}</div></div>
 <p style="font-size:13px;color:var(--muted);margin:8px 0 0">${esc(i.source||"")} · ${esc(i.date||"")} ${i.topic?`<span class="pill">${esc(i.topic)}</span>`:""}</p>
 <a class="src" href="${esc(i.link)}" target="_blank" rel="noopener">📖 متن اصلی</a> &nbsp; <a class="src" href="${tr(i.link)}" target="_blank" rel="noopener">🌐 ترجمه‌ی فارسی</a></div>`).join("")}`;
}

/* ---------- wiring ---------- */
RENDER.class = viewClass; RENDER.songs = viewSongs; RENDER.news = viewNews; RENDER.growth = viewGrowth;
const _home = RENDER.home;
RENDER.home = ()=> `<a class="tile" href="#class" style="background:linear-gradient(135deg,#fff1e8,#eef4ff);margin-bottom:14px"><div class="ic">🧑‍🏫</div><b>کلاس من: طرح درس امروز</b><span>شرایط کلاس و بچه‌ها را انتخاب کنید تا تحلیل علمی، راهکار رفتاری و طرح درس کامل بگیرید.</span></a>` + _home().replace('<div class="grid">', `<div class="grid"><a class="tile" href="#growth"><div class="ic">🎓</div><b>رشد حرفه‌ای من</b><span>برنامه‌ی ۱۲ هفته‌ای، روزی ۳۰ دقیقه</span></a><a class="tile" href="#news"><div class="ic">🗞️</div><b>اخبار روز</b><span>تازه‌ترین مقاله‌های دنیا، هر روز</span></a><a class="tile" href="#songs"><div class="ic">🎵</div><b>آهنگ‌ها</b><span>آهنگ‌های کلاس با لینک</span></a>`);
const vi = k=>VIEWS.findIndex(v=>v[0]===k);
VIEWS.splice(vi("home")+1,0,["class","🧑‍🏫 کلاس من"],["growth","🎓 رشد من"]);
VIEWS.splice(vi("finland")+1,0,["songs","🎵 آهنگ‌ها"],["news","🗞️ اخبار روز"]);
const ai = vi("articles"); if(ai>=0) VIEWS[ai][1]="📚 دانش و رشد";
document.getElementById("navbar").innerHTML = VIEWS.map(([k,l])=>`<a href="#${k}" data-k="${k}">${l}</a>`).join("");

function rerender(keepScroll){ const y=window.scrollY||document.documentElement.scrollTop||0; route(); if(keepScroll){ window.scrollTo({top:y,left:0,behavior:"instant"}); requestAnimationFrame(()=>window.scrollTo({top:y,left:0,behavior:"instant"})); } }
function refreshPlan(){ if(!showPlan) return; const o=document.getElementById("planOut"); if(o) o.innerHTML=planHTML(cur()); }
document.addEventListener("click", async e=>{
 const tp = e.target.closest("[data-topic]"); if(tp){ newsTopic=tp.dataset.topic; rerender(true); return; }
 const f = e.target.closest("[data-f]");
 if(f){ const c=cur(), k=f.dataset.f, v=f.dataset.v;
  if(f.dataset.m){ c[k]=c[k]||[]; c[k]=c[k].includes(v)?c[k].filter(x=>x!==v):[...c[k],v]; f.classList.toggle("on"); }
  else { c[k]=v; f.parentElement.querySelectorAll("[data-f]").forEach(x=>x.classList.toggle("on", x===f)); }
  save(); refreshPlan(); return; }
 const kd = e.target.closest("[data-kid]");
 if(kd){ const k=cur().kids[+kd.dataset.kid]; const v=kd.dataset.v; k.traits=k.traits||[]; k.traits=k.traits.includes(v)?k.traits.filter(x=>x!==v):[...k.traits,v]; kd.classList.toggle("on"); save(); refreshPlan(); return; }
 const kdel = e.target.closest("[data-kiddel]"); if(kdel){ cur().kids.splice(+kdel.dataset.kiddel,1); save(); rerender(true); return; }
 const id = e.target.id;
 if(id==="kidAdd"){ cur().kids.push({name:"",traits:[]}); save(); rerender(true); return; }
 if(id==="clsNew"){ ST.classes.push(Object.assign(newClass(),{name:"کلاس "+(ST.classes.length+1)})); ST.active=ST.classes.length-1; showPlan=false; save(); rerender(); return; }
 if(id==="clsDel"){ ST.classes.splice(ST.active,1); ST.active=0; showPlan=false; save(); rerender(); return; }
 if(id==="planBtn"){ showPlan=true; refreshPlan(); setTimeout(()=>{const o=document.getElementById("planOut"); if(o) o.scrollIntoView({behavior:"smooth",block:"start"});},60); return; }
 if(id==="planAgain"){ cur().seed=(cur().seed||1)+1; save(); refreshPlan(); const o=document.getElementById("planOut"); if(o) o.scrollIntoView({behavior:"smooth",block:"start"}); return; }
 if(id==="copyParent"){ try{ await navigator.clipboard.writeText(document.getElementById("parentMsg").textContent); e.target.textContent="کپی شد ✓"; }catch(err){ e.target.textContent="کپی نشد"; } return; }
 if(id==="pdPrev"||id==="pdNext"){ const s=pdState(); s.week=Math.max(0,Math.min(11,s.week+(id==="pdNext"?1:-1))); pdSave(s); rerender(); return; }
 if(id==="planCopy"){ try{ await navigator.clipboard.writeText(planText(cur())); e.target.textContent="کپی شد ✓"; }catch(err){ e.target.textContent="کپی نشد"; } return; }
 if(id==="planAI"){ const s=await getSample(); const out=document.getElementById("planAIOut"); if(!s||!out) return; out.style.display="block"; out.textContent="در حال فکر کردن…"; e.target.disabled=true;
  const c=cur(); const prof = `نوع کلاس: ${c.format}، سن: ${c.age}، تعداد: ${c.count}، مدت: ${c.dur} دقیقه، سطح: ${c.level}، فضا: ${c.space}، رویکرد: ${c.approach}، موضوع: ${THEMES[c.theme].fa}، هوش‌ها: ${(c.intel||[]).map(k=>INTEL_SHORT[k]).join("، ")||"همه"}، ویژگی‌های کلاس: ${allTraits(c).map(t=>TRAITS[t].fa).join("، ")||"ندارد"}، بچه‌ها: ${(c.kids||[]).map(k=>`${k.name||"کودک"} (${(k.traits||[]).map(t=>TRAITS[t]?TRAITS[t].fa:t).join("، ")})`).join("؛ ")||"-"}`;
  try{ const r=await s(`You are an expert early-childhood English teacher trainer and child psychologist. Write ONLY in Persian, with English teacher phrases in English. Class profile: ${prof}\nDraft plan:\n${planText(c)}\n\nImprove this into a richer, practical lesson plan for an Iranian preschool classroom, with evidence-based behavioral and psychological guidance for this class and for each named child, exact English phrases, and differentiation. Short headings and bullets, plain text.`,{modelTier:"default",cache:false,onText:({text})=>{out.textContent=text}}); out.textContent=r.text; }
  catch(err){ out.textContent="انجام نشد. کمی بعد دوباره امتحان کنید."; }
  e.target.disabled=false; return; }
});
document.addEventListener("change", e=>{
 const d=e.target.dataset||{};
 if(d.chk){ let st={}; try{ st=JSON.parse(localStorage.getItem("chk_"+d.chk)||"{}"); }catch(x){} st[d.i]=e.target.checked; try{ localStorage.setItem("chk_"+d.chk,JSON.stringify(st)); }catch(x){} return; }
 if(d.pdday!==undefined){ const s=pdState(); const k=todayKey(); s.days[k]=s.days[k]||{}; s.days[k][d.pdday]=e.target.checked; pdSave(s); return; }
 if(d.pdweek!==undefined){ const s=pdState(); s.done[d.pdweek]=e.target.checked; if(e.target.checked && s.week<11){ s.week++; } pdSave(s); rerender(); return; }
 if(e.target.id==="clsSel"){ ST.active=+e.target.value; showPlan=false; save(); rerender(); }
});
document.addEventListener("input", e=>{
 if(e.target.id==="pdJournal"){ const s=pdState(); s.journal=e.target.value; pdSave(s); return; }
 if(e.target.dataset && e.target.dataset.note!==undefined){ cur().notes=e.target.value; save(); return; }
 if(e.target.id==="clsName"){ cur().name=e.target.value; save(); const o=document.querySelector(`#clsSel option[value="${ST.active}"]`); if(o) o.textContent=e.target.value; }
 if(e.target.dataset && e.target.dataset.kidname!==undefined){ cur().kids[+e.target.dataset.kidname].name=e.target.value; save(); }
});
// AI button visibility (only inside Claude)
new MutationObserver(async()=>{ const b=document.getElementById("planAI"); if(b && b.style.display==="none"){ const s=await getSample(); if(s) b.style.display="inline-block"; } }).observe(document.getElementById("app"),{childList:true,subtree:true});
route();
})();

</script>
<script>
if("serviceWorker" in navigator){window.addEventListener("load",()=>{navigator.serviceWorker.register("sw.js").catch(()=>{})})}
</script>
